.recovery-hero{background:linear-gradient(135deg,#ffffff,#f5f9ff);border:1px solid #dbe5f1}.recovery-search-head{display:flex;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#2563eb}.recovery-search-head h2{margin:4px 0 4px;font-size:22px}.recovery-search-head p{margin:0;color:#64748b}.searchbox.big input{height:52px;font-size:16px}.empty-search{min-height:110px;border:1px dashed #cbd5e1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#475569;background:#f8fafc}.empty-icon{font-size:32px;color:#2563eb}.search-results-head{display:flex;justify-content:space-between;margin-bottom:10px;color:#334155}.customer-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.customer-result-card{border:1px solid #dbe5f1;border-radius:14px;padding:14px;background:#fff}.customer-result-main{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:12px;background:#e8f0ff;color:#1d4ed8;display:grid;place-items:center;font-weight:800}.loan-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.loan-chip,.quick-amounts button{border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:7px 10px;cursor:pointer}.loan-chip:hover,.quick-amounts button:hover{border-color:#2563eb;background:#eff6ff}.quick-amounts{display:flex;gap:6px;flex-wrap:wrap}.allocation-preview{margin-top:10px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;line-height:1.7}.allocation-title{font-weight:800;color:#0f172a;margin-bottom:5px}.allocation-footer{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #e2e8f0;font-size:12px}.errorbox{margin-top:8px;padding:9px;border-radius:9px;background:#fef2f2;color:#b91c1c;font-weight:700}.collection-calculator{background:#fbfdff}.product-row{min-height:74px}.muted{color:#64748b}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">₹</div><span id="brandName">MicroFinance Pro</span></div>
  <div class="nav">
    <button class="active" data-view="dashboard"><span class="ico">⌂</span><span class="txt">Dashboard</span></button>
    <button data-view="customers"><span class="ico">♙</span><span class="txt">Customers</span></button>
    <button data-view="products"><span class="ico">▣</span><span class="txt">Products</span></button>
    <button data-view="collection"><span class="ico">₹</span><span class="txt">Recovery</span></button>
    <button data-view="penalty"><span class="ico">!</span><span class="txt">Penalty</span></button>
    <button data-view="reports"><span class="ico">▤</span><span class="txt">Reports</span></button>
    <button data-view="accounting"><span class="ico">◈</span><span class="txt">Accounting</span></button>
    <button data-view="settings"><span class="ico">⚙</span><span class="txt">Settings</span></button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-search"><span>⌕</span><input id="globalSearch" placeholder="Search customer, mobile, Customer ID, Loan ID..."><button class="btn sm" id="globalSearchBtn">Search</button></div>
  <div class="top-actions"><button class="btn sm hide-m" id="todayBtn">Today</button><button class="btn sm" id="notifBtn">🔔 <span id="notifCount">0</span></button><div class="avatar">A</div></div>
</header>
<section class="content" id="appView"></section>
</main>
</div>

<div class="toast" id="toast"></div>

<!-- generic modal -->
<div class="modal-backdrop" id="modal">
 <div class="modal" id="modalBox"></div>
</div>

<script>
"use strict";
const INR = n => "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num = v => Math.max(0,Number(v)||0);
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const isoToday = () => new Date().toISOString().slice(0,10);
const addDays = (date,n)=>{const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diffDays = (a,b)=>Math.max(0,Math.floor((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000));
const money = v => Number(v||0);
const defaultState = {
  companyName:"MicroFinance Pro",
  products:[{id:"PRD001",name:"Daily 10K — 100 Days",type:"Daily Collection",loanAmount:10000,interestRate:5,interestAmount:1500,interestMethod:"upfront",frequency:"Daily",termDays:100,processing:0,documentation:0,penaltyPerDay:100,foreclosure:0,active:true}],
  customers:[{
    id:"C0001245",name:"Rahul Sharma",primary:"9876543210",secondary:"9123456780",address:"Main Bazar, Indore",
    guarantor:{name:"Suresh Sharma",primary:"9988776655",secondary:"9000012345",address:"Vijay Nagar, Indore"},
    loans:[{id:"L0005687",productId:"PRD001",disbursement:(()=>{const d=new Date();d.setDate(d.getDate()-45);return d.toISOString().slice(0,10)})(),principal:10000,netDisbursed:8500,interestMethod:"upfront",interestTotal:1500,termDays:100,frequency:"Daily",status:"Active",payments:[],penalties:[],extraCharges:0}]
  }]
};
let state = JSON.parse(localStorage.getItem("mfProState")||"null") || structuredClone(defaultState);
state.companyName = state.companyName || "MicroFinance Pro";
state.products = Array.isArray(state.products) ? state.products : [];
state.customers = Array.isArray(state.customers) ? state.customers : [];
let currentCustomer = state.customers[0], currentLoan = currentCustomer.loans[0], currentView="dashboard";
function save(){localStorage.setItem("mfProState",JSON.stringify(state))}
function product(id){return state.products.find(p=>p.id===id)}
function activeLoans(){return state.customers.flatMap(c=>(c.loans||[]).filter(l=>l.status==="Active").map(l=>{Object.defineProperty(l,"customer",{value:c,writable:true,configurable:true,enumerable:false});return l;}))}
function fullTermMonths(loan){
  const term=Number(loan.termDays||100);
  // Business rule: 100 days is treated as 3 months (not 4).
  return Math.max(1, Math.ceil(Math.min(term,90)/30));
}
function chargeMonths(loan, days){
  const d=Math.max(1,Math.floor(days||0)), full=fullTermMonths(loan);
  if(d<=loan.termDays) return Math.min(full, Math.max(1, Math.ceil(d/30)));
  const overdue=d-loan.termDays;
  return full + Math.floor(Math.max(0,overdue-1)/30);
}
function totalPrincipalRecovered(loan){return (loan.payments||[]).reduce((s,p)=>s+num(p.principal),0)}
function totalInterestReceived(loan){return (loan.payments||[]).reduce((s,p)=>s+num(p.interest),0)}
function totalPenaltyReceived(loan){return (loan.penalties||[]).filter(p=>p.status==="Received").reduce((s,p)=>s+num(p.receivedAmount||p.amount),0)}
function totalPenaltyDue(loan){return (loan.penalties||[]).filter(p=>p.status==="Due").reduce((s,p)=>s+num(p.remaining??p.amount),0)}
function loanSchedule(loan){
  const rows=[]; let total=loan.interestMethod==="upfront"?loan.principal:loan.principal+loan.interestTotal;
  const emi=total/loan.termDays;
  for(let i=0;i<loan.termDays;i++){rows.push({no:i+1,date:addDays(loan.disbursement,i+1),emi,received:0,actual:"",status:"Due",principal:0,interest:0})}
  return rows;
}
function scheduleTotal(loan){
  return loan.interestMethod==='upfront' ? Number(loan.principal||0) : Number(loan.principal||0)+Number(loan.interestTotal||0);
}
function paymentAllocation(loan, payment){
  const rows=loanSchedule(loan);
  const prior=(loan.payments||[]).filter(x=>x.id!==payment.id);
  for(const p of prior) allocateIntoRows(rows,p);
  return allocateIntoRows(rows,payment,true);
}
function allocateIntoRows(rows,payment,collectParts=false){
  let remaining=Number(payment.amount||0), parts=[];
  for(const r of rows){
    if(remaining<=0.000001) break;
    const need=Math.max(0,Number(r.emi)-Number(r.received||0));
    if(need<=0.000001) continue;
    const take=Math.min(need,remaining);
    r.received=Number((Number(r.received||0)+take).toFixed(2));
    r.actual=payment.date;
    r.paymentIds=(r.paymentIds||[]).concat(payment.id);
    r.status=r.received>=r.emi-0.005?'Paid':'Partial';
    parts.push({date:r.date,amount:take,paymentId:payment.id});
    remaining-=take;
  }
  return collectParts?{parts,unapplied:Number(Math.max(0,remaining).toFixed(2))}:{rows,unapplied:Number(Math.max(0,remaining).toFixed(2))};
}
function allocations(loan){
  const rows=loanSchedule(loan);
  for(const p of (loan.payments||[])) allocateIntoRows(rows,p);
  return rows;
}
function totalScheduledReceived(loan){return (loan.payments||[]).reduce((s,p)=>s+num(p.amount),0)}
function maxCollectable(loan){return Math.max(0,Number(scheduleTotal(loan))-totalScheduledReceived(loan))}
function paymentClassification(loan, payments=loan.payments||[]){
  let principalLeft=loan.interestMethod==='upfront'?Number(loan.netDisbursed||0):Number(loan.principal||0), principal=0, interest=0;
  for(const p of payments){
    const a=Number(p.amount||0), take=Math.min(a,Math.max(0,principalLeft));
    principal+=take; principalLeft-=take; interest+=Math.max(0,a-take);
  }
  return {principal,interest,principalLeft};
}
function loanTotals(loan){
  const cls=paymentClassification(loan);
  const principalRecovered=cls.principal;
  const principalBase=loan.interestMethod==='upfront'?Number(loan.netDisbursed||0):Number(loan.principal||0);
  const principalOutstanding=Math.max(0,principalBase-principalRecovered);
  const daysUsed=Math.max(0,diffDays(loan.disbursement,isoToday()));
  const months=chargeMonths(loan,daysUsed||1);
  const monthlyInterest=Number(loan.interestTotal||0)/fullTermMonths(loan);
  const interestApplicable=Math.min(Number(loan.interestTotal||0),monthlyInterest*months);
  const interestReceived=cls.interest;
  const recognizedInterest=interestReceived;
  const targetRecovery=scheduleTotal(loan);
  return {principalRecovered,principalOutstanding,daysUsed,months,monthlyInterest,interestApplicable,interestReceived,recognizedInterest,targetRecovery,principalBase,remainingTotal:Math.max(0,targetRecovery-totalScheduledReceived(loan))};
}
function revenueTotals(){
  let interest=0,penalty=0,principal=0;
  for(const c of state.customers)for(const l of c.loans){principal+=totalPrincipalRecovered(l);interest+=totalInterestReceived(l);penalty+=totalPenaltyReceived(l)}
  return {interest,penalty,principal};
}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modalBox").innerHTML="";window.__penMode=null;window.__penNow=null}
const modalEl=document.getElementById("modal");
modalEl.addEventListener("click",e=>{
  if(e.target.id==="modal" || e.target.closest("[data-close]")){closeModal();return;}
  const b=e.target.closest("[data-action]"); if(!b)return;
  handleAction(b);
});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function render(){
  const root=document.getElementById("appView");
  const fn={dashboard:renderDashboard,customers:renderCustomers,products:renderProducts,collection:renderCollection,penalty:renderPenalty,reports:renderReports,accounting:renderAccounting,settings:renderSettings}[currentView]||renderDashboard;
  root.innerHTML=fn();
  document.querySelector("#brandName")?.replaceChildren(document.createTextNode(state.companyName||"MicroFinance Pro"));
  document.title=(state.companyName||"MicroFinance Pro")+" — Daily Collection";
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
  bindView();
}
function header(title,sub,actions=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function renderDashboard(){
 const r=revenueTotals(), loans=activeLoans(), due=loans.filter(x=>loanTotals(x).daysUsed>0);
 const today=isoToday(), dueToday=loans.filter(x=>loanSchedule(x).find(z=>z.date===today && z.status!=="Paid"));
 return header("Executive Dashboard","Daily Collection • Real-time local working data",`<button class="btn primary" data-action="newLoan">＋ New Loan</button><button class="btn success" data-action="newCollection">＋ Collection</button>`)
 +`<div class="grid kpis">
 ${kpi("Active Loans",loans.length,"Portfolio")}
 ${kpi("Principal Recovered",INR(r.principal),"Realized")}
 ${kpi("Interest Income",INR(r.interest),"Received & recognized")}
 ${kpi("Penalty Income",INR(r.penalty),"Separate recognition")}

}
function editPayment(c,l,pid){const p=(l.payments||[]).find(x=>x.id===pid);if(!p)return;const old=p;openModal(`<div class="modal-head blue"><div><h3>Edit Collection</h3><div class="mini" style="color:#dbeafe">${esc(c.name)} • ${pid}</div></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="formgrid"><div class="field"><label>Actual Received Date</label><input id="epDate" type="date" value="${old.date}"></div><div class="field"><label>Amount Received (₹)</label><input id="epAmount" type="number" step="0.01" value="${old.amount}"></div><div class="field"><label>Payment Mode</label><select id="epMode"><option ${old.mode==='Cash'?'selected':''}>Cash</option><option ${old.mode==='UPI — PhonePe'?'selected':''}>UPI — PhonePe</option><option ${old.mode==='UPI — Google Pay'?'selected':''}>UPI — Google Pay</option><option ${old.mode==='UPI — Other UPI'?'selected':''}>UPI — Other UPI</option><option ${old.mode==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${old.mode==='Mixed Payment'?'selected':''}>Mixed Payment</option></select></div><div class="field full"><label>Remarks</label><textarea id="epRemark">${esc(old.remark||'')}</textarea></div></div><div class="notice">Editing a collection recalculates its principal/interest classification and all EMI allocations. Scheduled dates are never changed.</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="savePaymentEdit" data-customer="${c.id}" data-loan="${l.id}" data-payment="${pid}">Save Changes</button></div>`)}
function savePaymentEdit(c,l,pid){const p=(l.payments||[]).find(x=>x.id===pid);if(!p)return;const old={...p};const others=l.payments.filter(x=>x.id!==pid);const amount=num(document.getElementById('epAmount').value),date=document.getElementById('epDate').value;if(!amount||!date)return toast('Enter a valid amount and date.');const temp={id:pid,date,amount,mode:document.getElementById('epMode').value,remark:document.getElementById('epRemark').value,principal:0,interest:0};const cls=paymentClassification(l,others),base=l.interestMethod==='upfront'?Number(l.netDisbursed||0):Number(l.principal||0);temp.principal=Math.min(amount,Math.max(0,base-cls.principal));temp.interest=Math.max(0,amount-temp.principal);const usedOthers=others.reduce((s,x)=>s+Number(x.amount||0),0);if(usedOthers+amount>scheduleTotal(l)+0.005)return toast(`Edited amount exceeds total remaining recovery. Maximum allowed is ${INR(scheduleTotal(l)-usedOthers)}.`);p.date=temp.date;p.amount=temp.amount;p.mode=temp.mode;p.remark=temp.remark;p.principal=temp.principal;p.interest=temp.interest;save();closeModal();render();toast('Collection updated and schedule recalculated.');}
function deletePayment(c,l,pid){if(!confirm('Delete this collection? The EMI schedule and revenue recognition will be recalculated.'))return;l.payments=l.payments.filter(x=>x.id!==pid);if(l.status==='Closed'&&totalScheduledReceived(l)<scheduleTotal(l)-0.005)l.status='Active';save();closeModal();openCustomer(c,l);toast('Collection deleted and allocations recalculated.');}
function savePenalty(c,l){
 const amount=num(document.getElementById("penAmount").value);if(!amount)return toast("Enter penalty amount.");
 const now=window.__penNow?window.__penNow():true, mode=window.__penMode?window.__penMode():"Cash";
 l.penalties=l.penalties||[];l.penalties.push({id:"P"+Date.now(),attractedDate:document.getElementById("penDate").value,amount,status:now?"Received":"Due",receivedDate:now?document.getElementById("penReceivedDate").value:"",mode:now?mode:"",receivedAmount:now?Math.min(amount,num(document.getElementById("penReceivedAmount").value)):0,remaining:now?Math.max(0,amount-num(document.getElementById("penReceivedAmount").value)):amount,reason:document.getElementById("penReason").value,remark:document.getElementById("penRemark").value});
 save();closeModal();render();toast(now?"Penalty received and recognized separately.":"Penalty added to due ledger.");
}
function receivePenalty(c,l,pid){const p=(l.penalties||[]).find(x=>x.id===pid);if(!p)return;penaltyReceiveModal(c,l,p)}
function penaltyReceiveModal(c,l,p){
 openModal(`<div class="modal-head red"><div><h3>Receive Pending Penalty</h3><div class="mini" style="color:#fee2e2">Penalty remains separate from loan interest</div></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="grid four"><div class="card"><div class="mini">Attracted Date</div><strong>${p.attractedDate}</strong></div><div class="card"><div class="mini">Penalty Due</div><strong>${INR(p.remaining??p.amount)}</strong></div><div class="card"><div class="mini">Customer</div><strong>${esc(c.name)}</strong></div><div class="card"><div class="mini">Status</div><strong>Due</strong></div></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Received Date *</label><input id="prDate" type="date" value="${isoToday()}"></div><div class="field"><label>Received Amount (₹) *</label><input id="prAmount" type="number" value="${p.remaining??p.amount}"></div><div class="field"><label>Payment Mode</label><select id="prMode"><option>Cash</option><option>UPI — PhonePe</option><option>UPI — Google Pay</option><option>UPI — Other UPI</option><option>Bank Transfer</option><option>Mixed Payment</option></select></div><div class="field full"><label>Remarks</label><textarea id="prRemark">Penalty received against ${p.attractedDate}</textarea></div></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" data-action="confirmPenaltyReceipt" data-customer="${c.id}" data-loan="${l.id}" data-penalty="${p.id}">Receive Penalty</button></div>`);
}
function confirmPenaltyReceipt(c,l,pid){const p=(l.penalties||[]).find(x=>x.id===pid);if(!p)return;const max=num(p.remaining??p.amount),a=num(document.getElementById('prAmount').value);if(!a||a>max+0.005)return toast(`Enter an amount up to ${INR(p.amount)}.`);p.status=a>=max-0.005?'Received':'Due';p.receivedAmount=num(p.receivedAmount)+a;p.remaining=Math.max(0,max-a);p.receivedDate=document.getElementById('prDate').value;p.mode=document.getElementById('prMode').value;p.remark=document.getElementById('prRemark').value;save();closeModal();render();toast(`Penalty receipt ${INR(a)} recorded separately.`)}
function collectionSelectorModal(){
 openModal(`<div class="modal-head green"><div><h3>Select Customer for Collection</h3><div class="mini" style="color:#dcfce7">Search first; no portfolio list is loaded.</div></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="searchbox big"><input id="selectorSearch" placeholder="Name, surname, mobile, Customer ID or Loan ID" autofocus><button class="btn primary" id="selectorBtn" type="button">Find</button></div><div id="selectorResults" style="margin-top:14px"><div class="empty-search"><strong>Type to search</strong><span>Only matching customers will appear.</span></div></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button></div>`);
 const go=()=>{document.getElementById('selectorResults').innerHTML=customerResults(document.getElementById('selectorSearch').value,8)};document.getElementById('selectorBtn').onclick=go;document.getElementById('selectorSearch').addEventListener('input',go);document.getElementById('selectorSearch').focus();
}
function newPenalty(){const x=activeLoans()[0];if(x)penaltyModal(x.customer,x,addDays(isoToday(),-1));else toast("No active loan available.")}
function exportCSV(){const rows=[["Customer","Loan ID","Date","Amount","Principal","Interest","Penalty"]];state.customers.forEach(c=>c.loans.forEach(l=>{(l.payments||[]).forEach(p=>rows.push([c.name,l.id,p.date,p.amount,p.principal,p.interest,0]));(l.penalties||[]).forEach(p=>rows.push([c.name,l.id,p.receivedDate||p.attractedDate,p.receivedAmount||p.amount,0,0,p.status==="Received"?p.amount:0]))}));const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="microfinance-ledger.csv";a.click();URL.revokeObjectURL(a.href)}
function showLedger(){
 const rows=[];
 state.customers.forEach(c=>c.loans.forEach(l=>{
  (l.payments||[]).forEach(p=>rows.push({date:p.date,id:p.id,customer:c.name,loan:l.id,category:"Principal / Interest",amount:p.amount,mode:p.mode,remark:p.remark||""}));
  (l.penalties||[]).forEach(p=>rows.push({date:p.receivedDate||p.attractedDate,id:p.id,customer:c.name,loan:l.id,category:p.status==="Received"?"Penalty Revenue":"Penalty Due",amount:p.status==="Received"?(p.receivedAmount||p.amount):p.amount,mode:p.mode||"—",remark:p.remark||p.reason||""}));
 }));
 rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 openModal(`<div class="modal-head blue"><div><h3>Transaction Ledger</h3><div class="mini" style="color:#dbeafe">Actual transaction dates • principal, interest and penalty kept distinct</div></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Transaction ID</th><th>Customer</th><th>Loan ID</th><th>Category</th><th>Amount</th><th>Mode</th><th>Remarks</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.id}</td><td>${esc(r.customer)}</td><td>${r.loan}</td><td>${r.category}</td><td>${INR(r.amount)}</td><td>${esc(r.mode)}</td><td>${esc(r.remark)}</td></tr>`).join("")||`<tr><td colspan="8" class="center muted">No transactions recorded yet.</td></tr>`}</tbody></table></div></div><div class="modal-foot"><button class="btn" data-close>Close</button><button class="btn primary" data-action="exportCSV">Export CSV</button></div>`);
}
function handleAction(b){
 const a=b.dataset.action,cid=b.dataset.customer,lid=b.dataset.loan,c=state.customers.find(x=>x.id===cid),l=c?.loans.find(x=>x.id===lid);
 if(a==="newProduct")newProductModal(); else if(a==="newCustomer")newCustomerModal(); else if(a==="newLoan")newCustomerModal(); else if(a==="newCollection"){collectionSelectorModal()}
 else if(a==="collect"&&c&&l)collectModal(c,l); else if(a==="openCustomer"&&c)openCustomer(c,l); else if(a==="editPayment"&&c&&l)editPayment(c,l,b.dataset.payment); else if(a==="deletePayment"&&c&&l)deletePayment(c,l,b.dataset.payment); else if(a==="savePaymentEdit"&&c&&l)savePaymentEdit(c,l,b.dataset.payment); else if(a==="confirmPenaltyReceipt"&&c&&l)confirmPenaltyReceipt(c,l,b.dataset.penalty);
 else if(a==="editCustomer"&&c)editCustomer(c.id); else if(a==="deleteCustomer"&&c)deleteCustomer(c.id);
 else if(a==="editProduct")editProduct(b.dataset.id); else if(a==="deleteProduct")deleteProduct(b.dataset.id);
 else if(a==="preclose"&&c&&l)precloseModal(c,l); else if(a==="settlement"&&c&&l)settlementModal(c,l); else if(a==="penalty"&&c&&l)penaltyModal(c,l);
 else if(a==="newPenalty")newPenalty(); else if(a==="receivePenalty"&&c&&l)receivePenalty(c,l,b.dataset.penalty);
 else if(a==="saveProduct")saveProduct(); else if(a==="saveProductEdit")saveProduct(b.dataset.id); else if(a==="saveCustomer")saveCustomer(); else if(a==="saveCustomerEdit")saveCustomerEdit(b.dataset.id); else if(a==="savePayment"&&c&&l)savePayment(c,l); else if(a==="savePenalty"&&c&&l)savePenalty(c,l);
 else if(a==="confirmPreclose"&&c&&l)confirmPreclose(c,l); else if(a==="confirmSettlement"&&c&&l)confirmSettlement(c,l);
 else if(a==="exportCSV")exportCSV(); else if(a==="showLedger")showLedger();
 else if(a==="resetDemo"){if(confirm("Restore the original demo portfolio? This replaces current local data.")){state=structuredClone(defaultState);state.companyName="MicroFinance Pro";save();currentCustomer=state.customers[0];currentLoan=currentCustomer?.loans[0];render();toast("Demo data restored.")}}
 else if(a==="clearAllData"){if(confirm("Clear ALL local customers, loans, products and transactions from this browser?")){state={companyName:state.companyName||"MicroFinance Pro",products:[],customers:[]};save();currentCustomer=null;currentLoan=null;render();toast("All local data cleared.")}}
 else if(a==="saveCompanyName"){const v=document.getElementById("companyNameSetting")?.value.trim();if(!v)return toast("Enter a company name.");state.companyName=v;save();render();toast("Company name updated.")}
 else if(a==="recoverySearch"){const q=document.getElementById("recoverySearch").value;document.getElementById("recoveryResults").innerHTML=customerResults(q)}
 else if(a==="searchCustomers"){const q=document.getElementById("customerSearch").value;document.getElementById("customerResults").innerHTML=customerResults(q)}
 else if(a==="printSettlement")window.print();
}
function bindView(){
 document.querySelectorAll("[data-view-link]").forEach(b=>b.onclick=()=>{currentView=b.dataset.viewLink;render()});
 document.querySelectorAll("[data-action]").forEach(b=>{if(!b.closest("#modal"))b.onclick=()=>handleAction(b)});
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
document.getElementById("globalSearchBtn").onclick=()=>{currentView="customers";render();setTimeout(()=>{const i=document.getElementById("customerSearch");if(i){i.value=document.getElementById("globalSearch").value;document.querySelector('[data-action="searchCustomers"]').click()}},0)};
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("globalSearchBtn").click()});
document.getElementById("notifBtn").onclick=()=>document.getElementById("notificationPanel").classList.toggle("show");
document.getElementById("todayBtn").onclick=()=>toast("Today: "+isoToday());
document.getElementById("notificationPanel").innerHTML=`<h3>🔔 Today’s Reminders</h3><div class="mini">Live reminder panel for due collections and pending penalties.</div><div style="margin-top:10px" id="reminderBody"></div>`;
function updateReminders(){
 const today=isoToday(), due=[];activeLoans().forEach(x=>{const r=loanSchedule(x).find(z=>z.date===today&&z.status!=="Paid");if(r)due.push(`${x.customer.name} — ${INR(r.emi)}`)});
 const p=activeLoans().reduce((s,l)=>s+totalPenaltyDue(l),0);
 document.getElementById("notifCount").textContent=due.length+(p?1:0);
 document.getElementById("reminderBody").innerHTML=(due.length?due.slice(0,8).map(x=>`<div class="metric"><span>Due today</span><strong>${esc(x)}</strong></div>`).join(""):`<div class="successbox" style="padding:10px">No due collection found for today.</div>`)+(p?`<div class="metric"><span>Penalty pending</span><strong>${INR(p)}</strong></div>`:"");
}
render();updateReminders();
</script>
</body>
</html>

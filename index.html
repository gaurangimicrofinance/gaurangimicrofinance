<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f36"><title>ब्याज बही · खाता और हिसाब</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:16px/1.55 "Noto Sans Devanagari",system-ui,sans-serif;color:#243b32;background:#f6f5ef}header,main{max-width:1080px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #cfd7cc}header strong{font-size:24px;color:#164f40}.brand{display:flex;align-items:center;gap:12px}.icon{background:#164f40;color:white;border-radius:10px;padding:3px 10px}button,select,input,textarea{font:inherit}button{border:1px solid #bccbc0;border-radius:8px;padding:9px 15px;background:#fff;color:#174c3c;cursor:pointer}button:hover,button.active{background:#dce9dc}button.primary{background:#18523e;color:white;border-color:#18523e}button:disabled{opacity:.55}nav,.row,.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row{justify-content:space-between}.hero{background:#173f36;color:white;border-radius:16px;padding:24px 30px;margin:18px 0}.kpis,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.kpis>div{border-left:2px solid #acc599;padding-left:14px}.kpis small{color:#d5e4d8}.kpis b{display:block;font-size:clamp(19px,3vw,31px);overflow-wrap:anywhere}h1{font-size:clamp(24px,4vw,38px);margin:6px 0 14px}h2{font-size:21px}h2,h3,p{margin:8px 0}.card,dialog{background:#fff;border:1px solid #d5dbd1;border-radius:14px;padding:20px;margin:15px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:5px;font-size:14px;font-weight:600}.full{grid-column:1/-1}input,select,textarea{width:100%;min-width:0;padding:10px;border:1px solid #b9c9bc;border-radius:7px;background:white;color:#1d342b}.tools input,.tools select{width:auto;max-width:100%}dialog{position:fixed;margin:auto;width:min(600px,94vw);max-height:90vh;color:inherit}dialog::backdrop{background:#142d2399}dialog h2{margin:0 0 16px}.entry{width:100%;display:flex;align-items:center;text-align:left;justify-content:space-between;gap:14px;border:0;border-bottom:1px solid #dee5dc;border-radius:0;background:white;padding:15px 4px}.entry strong{display:block;font-size:17px}.entry span:last-child{text-align:right}small,.muted{color:#54685b}.money{font-variant-numeric:tabular-nums;color:#195741}.tag{display:inline-block;background:#eaf1e5;color:#325b40;padding:2px 9px;border-radius:6px;font-size:13px}.empty{padding:30px 4px;color:#586c60}.error{color:#982f25}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #d9e0d5;white-space:nowrap}#status{color:#843624}details{margin:15px 0}summary{cursor:pointer}button:focus-visible,:focus-visible{outline:3px solid #a46b20;outline-offset:2px}@media(max-width:650px){header,main{padding:14px}header{gap:9px}nav button{padding:7px 10px}.hero{padding:18px}.kpis{grid-template-columns:1fr 1fr;gap:14px}.kpis>div:last-child{grid-column:1/-1}.card{padding:14px}.grid{gap:9px}.tools input{width:100%}}@media print{header nav,.tools,button,dialog,#status,.noprint{display:none!important}body{background:white}.hero{background:white;color:black}.kpis small{color:black}.scroll{overflow:visible}main,header{padding:4px}.card{break-inside:avoid}td,th{white-space:normal}}
</style>
<header><div class="brand"><strong class="icon">ब</strong><strong>ब्याज बही</strong></div><nav id="nav"></nav></header><main><div id="status" role="status"></div><section id="view"></section></main><dialog id="dialog"><form id="form"><div class="row"><h2 id="title"></h2><button type="button" id="close" aria-label="बंद करें">×</button></div><div id="fields" class="grid"></div><p id="err" class="error" role="alert"></p><button class="primary">सहेजें</button></form></dialog><input type="file" hidden id="restoreFile" accept=".json,application/json">
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'—',cash=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const periods={1:'वार्षिक',2:'छमाही',4:'तिमाही',6:'हर दो महीने',12:'मासिक',24:'महीने में दो बार',26:'हर दो सप्ताह',52:'साप्ताहिक',104:'सप्ताह में दो बार',360:'दैनिक'};
const directions={lend:'दिया हुआ',borrow:'लिया हुआ'},alloc={both:'पहले ब्याज, फिर मूलधन',principal:'केवल मूलधन',interest:'केवल ब्याज'},modes={cash:'नकद',upi:'UPI',bank:'बैंक',other:'अन्य'};
const dateOf=d=>new Date(d+'T00:00:00Z'),validDate=d=>typeof d==='string'&&/^\d{4}-\d\d-\d\d$/.test(d)&&Number.isFinite(+dateOf(d))&&dateOf(d).toISOString().slice(0,10)===d;
function yearPart(start,end){
 const a=dateOf(start),b=dateOf(end);if(b<a)throw Error('अंतिम तारीख आरंभ से पहले है।');
 let months=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
 if(b.getUTCDate()<a.getUTCDate())months--;
 let anchor=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+months,1));
 let last=new Date(Date.UTC(anchor.getUTCFullYear(),anchor.getUTCMonth()+1,0)).getUTCDate();
 anchor.setUTCDate(Math.min(last,a.getUTCDate()));return months/12+(b-anchor)/86400000/360;
}
function growth(l,start,end){
 const y=yearPart(start,end),r=l.rate*l.unit/100,n=l.freq;
 if(l.type==='simple')return 1+y*r;
 let whole=Math.floor(y*n);return Math.pow(1+r/n,whole)*(1+Math.max(0,y-whole/n)*r);
}
function balance(l,end=today()){
 if(l.closed&&end>l.closed)end=l.closed;
 if(end<l.start)return {p:0,i:0,paid:0,rows:[]};
 let p=l.amount,anchor=l.start,carried=0,interestPaid=0,paid=0,rows=[];
 const interest=d=>carried+p*(growth(l,anchor,d)-1)-interestPaid;
 for(const t of l.payments){
 if(t.date>end)break;
 let due=Math.max(0,interest(t.date)),ip=t.kind==='principal'?0:Math.min(due,t.amount),pp=t.amount-ip;
 if((t.kind==='interest'&&pp>0.005001)||pp>p+0.005001)throw Error('भुगतान चुने गए बकाये से अधिक है। तारीख और राशि जाँचें।');
 if(t.kind==='interest'){ip=t.amount;pp=0}
 if(pp>0){carried=Math.max(0,due-ip);p=Math.max(0,p-pp);anchor=t.date;interestPaid=0}else interestPaid+=ip;
 paid+=t.amount;rows.push({...t,ip,pp,p,i:Math.max(0,due-ip)});
 }
 let i=Math.max(0,interest(end));if(!Number.isFinite(i)||!Number.isFinite(p+i))throw Error('हिसाब समर्थित अंकों की सीमा से बाहर है।');
 return {p,i,paid,rows};
}
const fresh=()=>({version:1,rev:0,people:[],loans:[],history:[]});
let db,data=fresh(),page='book',selected='',query='',filter='all',closedFilter='open',asof=today(),submitter,calcResult=null;
function check(ok,msg){if(!ok)throw Error(msg||'बैकअप में अमान्य जानकारी है।')}
function numeric(n){return typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=1e12}
function terms(l){check(numeric(l.amount)&&l.amount>0&&numeric(l.rate)&&Object.hasOwn(periods,l.unit)&&Object.hasOwn(periods,l.freq)&&['simple','compound'].includes(l.type)&&validDate(l.start))}
function validate(s){
 check(s&&s.version===1&&Array.isArray(s.people)&&Array.isArray(s.loans)&&Array.isArray(s.history));let ids=new Set;
 function id(x){check(typeof x==='string'&&x.length>0&&!ids.has(x));ids.add(x)}
 for(const p of s.people){id(p.id);check(typeof p.name==='string'&&p.name.trim().length&&typeof p.phone==='string')}
 let people=new Set(s.people.map(p=>p.id));
 for(const l of s.loans){id(l.id);terms(l);check(people.has(l.person)&&Object.hasOwn(directions,l.dir)&&Array.isArray(l.payments)&&l.start<=today()&&(!l.due||validDate(l.due)&&l.due>=l.start));let prev=l.start;
 for(const t of l.payments){id(t.id);check(validDate(t.date)&&t.date>=prev&&t.date<=today()&&numeric(t.amount)&&t.amount>0&&Object.hasOwn(alloc,t.kind)&&Object.hasOwn(modes,t.mode));prev=t.date}
 check(!l.closed||(validDate(l.closed)&&l.closed>=prev&&l.closed<=today()));balance(l)}
 for(const h of s.history){terms(h);check(validDate(h.end)&&h.end>=h.start&&Number.isFinite(growth(h,h.start,h.end)*h.amount))}
}
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function load(){data=await request(db.transaction('ledger').objectStore('ledger').get('main'))||fresh()}
async function save(next){
 validate(next);
 await new Promise((res,rej)=>{const tx=db.transaction('ledger','readwrite'),s=tx.objectStore('ledger'),r=s.get('main');let conflict=false;r.onsuccess=()=>{if((r.result?.rev||0)!==data.rev){conflict=true;tx.abort();return}next.rev=data.rev+1;s.put(next,'main')};tx.oncomplete=res;tx.onabort=()=>rej(Error(conflict?'दूसरे टैब में बदलाव हुआ है। पेज रीलोड करके फिर प्रयास करें।':'डेटा सहेजा नहीं जा सका।'))});
 data=next;render();
}
const uid=()=>crypto.randomUUID(),action=(label,a,cls='')=>'<button type="button" class="'+cls+'" data-act="'+a+'">'+label+'</button>';
const options=(o,v)=>Object.entries(o).map(([k,t])=>'<option value="'+esc(k)+'" '+(String(v)===k?'selected':'')+'>'+esc(t)+'</option>').join('');
const select=(n,l,o,v)=>'<label>'+l+'<select name="'+n+'">'+options(o,v)+'</select></label>';
const inp=(n,l,t='text',v='',attrs='required')=>'<label>'+l+'<input name="'+n+'" type="'+t+'" value="'+esc(v)+'" '+attrs+'></label>';
const moneyAttrs='required min="0.01" max="1000000000000" step=".01"';
function termFields(l={}){return inp('amount','मूलधन (₹)','number',l.amount||'',moneyAttrs)+inp('rate','ब्याज दर (%)','number',l.rate??'2','required min="0" max="10000" step="any"')+select('unit','दर किस अवधि की है?',periods,l.unit||12)+select('type','ब्याज का प्रकार',{simple:'साधारण',compound:'चक्रवृद्धि'},l.type||'simple')+select('freq','चक्रवृद्धि की अवधि',periods,l.freq||12)+inp('start','शुरू होने की तारीख','date',l.start||today())}
function termValues(f){return {amount:+f.amount,rate:+f.rate,unit:+f.unit,freq:+f.freq,type:f.type,start:f.start}}
function modal(title,html,cb,label='सहेजें'){submitter=cb;$('title').textContent=title;$('fields').innerHTML=html;$('err').textContent='';$('form').querySelector('.primary').textContent=label;syncFreq();$('dialog').showModal()}
function syncFreq(){let f=$('form').elements;if(f.freq)f.freq.closest('label').hidden=f.type.value!=='compound'}
$('form').onchange=syncFreq;$('close').onclick=()=>$('dialog').close();
$('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter||$('form').querySelector('.primary');b.disabled=true;try{await submitter(Object.fromEntries(new FormData(e.target)));$('dialog').close()}catch(x){$('err').textContent=x.message}finally{b.disabled=false}};
const kpis=items=>'<div class="hero"><div class="kpis">'+items.map(([k,v])=>'<div><small>'+k+'</small><b>'+cash(v)+'</b></div>').join('')+'</div></div>';
function person(l){return data.people.find(p=>p.id===l.person)}
function rules(){return '<details><summary>गणना का तरीका</summary><p>पूरे कैलेंडर महीने ÷ 12 और बचे दिन ÷ 360। साधारण ब्याज = मूलधन × वार्षिक दर × समय। चक्रवृद्धि में पूरी अवधियों पर ब्याज जुड़ता है और बची अवधि पर साधारण ब्याज लगता है। आरंभ की तारीख पर ब्याज शून्य है।</p><p>इस संस्करण में मूलधन घटाने पर शेष मूलधन की नई अवधि भुगतान की तारीख से शुरू होती है। पुराना बचा ब्याज अलग रहता है। केवल ब्याज भुगतान पर अवधि जारी रहती है। अंतिम प्रदर्शन दो दशमलव में है।</p></details>'}
function book(){
 let active=data.loans.filter(l=>!l.closed),lend=0,borrow=0,interest=0;for(let l of active){let b=balance(l);if(l.dir==='lend'){lend+=b.p+b.i;interest+=b.i}else borrow+=b.p+b.i}
 return '<div class="row"><h1>खाता बही</h1><div class="tools">'+action('ग्राहक जोड़ें','person')+action('＋ नया खाता','new','primary')+'</div></div>'+kpis([['कुल लेना है',lend],['कुल देना है',borrow],['लेने योग्य ब्याज',interest]])+'<div class="card"><div class="tools"><input id="search" aria-label="ग्राहक खोजें" placeholder="नाम या मोबाइल खोजें" value="'+esc(query)+'"><select id="filter" aria-label="खाते का प्रकार">'+options({all:'सभी प्रकार',...directions},filter)+'</select><select id="closedFilter" aria-label="खाता स्थिति">'+options({open:'चालू खाते',closed:'बंद खाते',all:'सभी खाते'},closedFilter)+'</select></div><div id="list">'+list()+'</div></div>';
}
function list(){let ls=data.loans.filter(l=>(closedFilter==='all'||(closedFilter==='closed')===!!l.closed)&&(filter==='all'||l.dir===filter)&&(person(l).name+' '+person(l).phone).toLowerCase().includes(query.toLowerCase()));return ls.reverse().map(l=>{let b=balance(l);return '<button class="entry" data-act="detail" data-id="'+esc(l.id)+'"><span><strong>'+esc(person(l).name)+'</strong><small>'+directions[l.dir]+' · '+fmt(l.start)+' · '+esc(l.rate)+'% '+periods[l.unit]+'</small></span><span><strong class="money">'+cash(b.p+b.i)+'</strong><small>'+(l.closed?'बंद':l.due&&l.due<today()?'देय तारीख बीती':'बकाया')+'</small></span></button>'}).join('')||'<p class="empty">'+(data.loans.length?'इस फ़िल्टर में कोई खाता नहीं मिला।':'पहला खाता खोलने के लिए “नया खाता” चुनें।')+'</p>'}
function detail(l){
 const b=balance(l,asof),p=person(l);
 return action('← खाता बही','book')+'<div class="row"><div><h1>'+esc(p.name)+'</h1><span class="tag">'+directions[l.dir]+' · '+(l.closed?'बंद':'चालू')+'</span> '+esc(p.phone)+'</div><div class="tools">'+(l.closed?action('खाता फिर खोलें','reopen'):action('＋ भुगतान दर्ज करें','pay','primary')+action('निपटान करें','settle'))+action('प्रिंट / PDF','print')+'</div></div><div class="tools"><label>इस तारीख तक का हिसाब<input type="date" id="asof" min="'+l.start+'" max="'+today()+'" value="'+asof+'"></label></div>'+kpis([['शेष मूलधन',b.p],['बकाया ब्याज',b.i],['कुल बकाया',b.p+b.i]])+'<section class="card"><h2>खाते की शर्तें</h2><p>'+cash(l.amount)+' · '+l.rate+'% '+periods[l.unit]+' · '+(l.type==='simple'?'साधारण ब्याज':'चक्रवृद्धि '+periods[l.freq])+'</p><p>आरंभ '+fmt(l.start)+' · देय तारीख '+fmt(l.due)+(l.closed?' · निपटान '+fmt(l.closed):'')+'</p><p>'+esc(l.note)+'</p>'+rules()+'</section><section class="card"><h2>भुगतान इतिहास</h2><p>कुल भुगतान '+cash(b.paid)+'</p><div class="scroll"><table><thead><tr><th>तारीख</th><th>राशि</th><th>ब्याज</th><th>मूलधन</th><th>माध्यम / विवरण</th><th></th></tr></thead><tbody>'+b.rows.slice().reverse().map(t=>'<tr><td>'+fmt(t.date)+'</td><td>'+cash(t.amount)+'</td><td>'+cash(t.ip)+'</td><td>'+cash(t.pp)+'</td><td>'+modes[t.mode]+' · '+alloc[t.kind]+' '+esc(t.note)+'</td><td>'+(!l.closed?'<button data-act="editpay" data-id="'+esc(t.id)+'">सुधारें</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'+(!b.rows.length?'<p class="muted">इस तारीख तक कोई भुगतान दर्ज नहीं है।</p>':'')+'</section>';
}
function calc(){let h=calcResult||data.history.at(-1);return '<div class="row"><h1>ब्याज कैलकुलेटर</h1>'+action('नई गणना','compute','primary')+'</div>'+(h?kpis([['मूलधन',h.amount],['ब्याज',h.amount*(growth(h,h.start,h.end)-1)],['कुल रकम',h.amount*growth(h,h.start,h.end)]]):'')+'<div class="card"><h2>पिछली गणनाएँ</h2>'+data.history.slice().reverse().map(x=>'<p>'+fmt(x.start)+' – '+fmt(x.end)+' · '+cash(x.amount)+' · '+x.rate+'% '+periods[x.unit]+' · '+(x.type==='simple'?'साधारण':'चक्रवृद्धि '+periods[x.freq])+' · ब्याज <b>'+cash(x.amount*(growth(x,x.start,x.end)-1))+'</b></p>').join('')+(!data.history.length?'<p>राशि और तारीखें चुनने के लिए नई गणना खोलें।</p>':'')+rules()+'</div>'}
function render(){let pages={book:'खाते',people:'ग्राहक',stats:'सारांश',calc:'कैलकुलेटर',backup:'बैकअप'};$('nav').innerHTML=Object.entries(pages).map(([k,v])=>action(v,k,(page===k||(page==='detail'&&k==='book'))?'active':'')).join('');$('view').innerHTML=page==='book'?book():page==='people'?customers():page==='stats'?stats():page==='detail'?detail(current()):page==='calc'?calc():'<h1>बैकअप और बहाली</h1><section class="card"><h2>अपने खातों की प्रति रखें</h2><p>इस साइट का डेटा इसी ब्राउज़र के IndexedDB में सहेजा जाता है। दूसरे फ़ोन या कंप्यूटर पर ले जाने के लिए बैकअप डाउनलोड करें।</p><div class="tools">'+action('बैकअप डाउनलोड','download','primary')+action('बैकअप बहाल करें','restore')+'</div><p class="muted">'+data.people.length+' ग्राहक · '+data.loans.length+' खाते</p></section>'}
function current(){return data.loans.find(l=>l.id===selected)}
function customers(){return '<div class="row"><h1>ग्राहक</h1>'+action('＋ ग्राहक जोड़ें','person','primary')+'</div><div class="card">'+(data.people.map(p=>'<div class="row"><p><b>'+esc(p.name)+'</b><br><small>'+esc(p.phone)+' · '+data.loans.filter(l=>l.person===p.id).length+' खाते</small></p><button data-act="editperson" data-id="'+esc(p.id)+'">सुधारें</button></div>').join('')||'<p>अभी कोई ग्राहक दर्ज नहीं है।</p>')+'</div>'}
function stats(){let groups=Object.keys(directions).map(dir=>{let ls=data.loans.filter(l=>l.dir===dir),g={count:ls.length,open:0,p:0,i:0,paid:0,ip:0};for(let l of ls){let b=balance(l);if(!l.closed){g.open++;g.p+=b.p;g.i+=b.i}g.paid+=b.paid;g.ip+=b.rows.reduce((v,t)=>v+t.ip,0)}return g});return '<h1>कारोबार का सारांश</h1><div class="card scroll"><table><thead><tr><th>विवरण</th><th>दिया हुआ</th><th>लिया हुआ</th></tr></thead><tbody>'+[['count','कुल खाते'],['open','चालू खाते'],['p','बकाया मूलधन'],['i','बकाया ब्याज'],['paid','दर्ज भुगतान'],['ip','भुगतान में ब्याज']].map(([k,t],i)=>'<tr><th>'+t+'</th>'+groups.map(g=>'<td>'+(i<2?g[k]:cash(g[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+action('प्रिंट / PDF','print')}
function addPerson(p){modal(p?'ग्राहक सुधारें':'ग्राहक जोड़ें',inp('name','ग्राहक का नाम','text',p?.name||'','required maxlength="100"')+inp('phone','मोबाइल (वैकल्पिक)','tel',p?.phone||'','maxlength="20"'),async f=>{check(f.name.trim(),'नाम दर्ज करें।');let s=structuredClone(data),v={id:p?.id||uid(),name:f.name.trim(),phone:f.phone.trim()};if(p)s.people[s.people.findIndex(x=>x.id===p.id)]=v;else s.people.push(v);await save(s)})}
function newLoan(){let pp=Object.fromEntries(data.people.map(p=>[p.id,p.name+(p.phone?' · '+p.phone:'')]));modal('नया खाता',select('person','ग्राहक',{'new':'नया ग्राहक',...pp},data.people.at(-1)?.id||'new')+'<div class="full grid" id="newperson">'+inp('name','नए ग्राहक का नाम','text','','maxlength="100"')+inp('phone','मोबाइल (वैकल्पिक)','tel','','maxlength="20"')+'</div>'+select('dir','लेन-देन',directions,'lend')+termFields()+inp('due','देय तारीख (वैकल्पिक)','date','','')+inp('note','नोट (वैकल्पिक)','text','','maxlength="500"'),async f=>{let s=structuredClone(data),id=f.person;if(id==='new'){check(f.name.trim(),'ग्राहक का नाम दर्ज करें।');id=uid();s.people.push({id,name:f.name.trim(),phone:f.phone.trim()})}let l={...termValues(f),person:id,id:uid(),dir:f.dir,due:f.due,note:f.note,payments:[],closed:null};check(l.start<=today(),'आरंभ की तारीख भविष्य में है।');check(!l.due||l.due>=l.start,'देय तारीख आरंभ के बाद रखें।');s.loans.push(l);await save(s);selected=l.id;page='detail';asof=today();render()});let f=$('form').elements;f.start.max=today();const change=()=>{$('newperson').style.display=f.person.value==='new'?'grid':'none';f.name.required=f.person.value==='new'};f.person.onchange=change;change()}
function payment(t,settle=false){let l=current(),day=t?.date||today(),b=balance(l,day),amt=t?.amount??(settle?+(b.p+b.i).toFixed(2):'');modal(settle?'पूरा भुगतान और निपटान':t?'भुगतान सुधारें':'भुगतान दर्ज करें',inp('amount','भुगतान (₹)','number',amt,moneyAttrs+(settle?' readonly':''))+inp('date','भुगतान की तारीख','date',day,'required min="'+l.start+'" max="'+today()+'"'+(settle?' readonly':''))+(settle?'':select('kind','भुगतान कहाँ लगाएँ?',alloc,t?.kind||'both'))+select('mode','भुगतान माध्यम',modes,t?.mode||'cash')+inp('note','नोट (वैकल्पिक)','text',t?.note||'','maxlength="500"'),async f=>{let s=structuredClone(data),a=s.loans.find(x=>x.id===l.id),v={id:t?.id||uid(),date:f.date,amount:+f.amount,kind:f.kind||'both',mode:f.mode,note:f.note};if(t)a.payments[a.payments.findIndex(x=>x.id===t.id)]=v;else a.payments.push(v);a.payments.sort((x,y)=>x.date.localeCompare(y.date));if(settle)a.closed=f.date;await save(s);asof=today();render()})}
document.addEventListener('click',async e=>{let btn=e.target.closest('[data-act]');if(!btn)return;let a=btn.dataset.act;$('status').textContent='';try{
 if(['book','people','stats','backup','calc'].includes(a)){page=a;render()}
 if(a==='detail'){selected=btn.dataset.id;asof=today();page='detail';render()}
 if(a==='person')addPerson();if(a==='editperson')addPerson(data.people.find(x=>x.id===btn.dataset.id));if(a==='new')newLoan();if(a==='pay')payment();if(a==='editpay')payment(current().payments.find(t=>t.id===btn.dataset.id));
 if(a==='settle'){let b=balance(current());if(b.p+b.i>=.005)payment(null,true);else modal('शून्य बकाया खाता बंद करें','<p>इस खाते पर आगे ब्याज रुक जाएगा।</p>',async()=>{let s=structuredClone(data);s.loans.find(x=>x.id===selected).closed=today();await save(s)},'बंद करें')}
 if(a==='reopen')modal('खाता फिर खोलें','<p>भुगतान इतिहास सुरक्षित रहेगा।</p>',async()=>{let s=structuredClone(data);s.loans.find(x=>x.id===selected).closed=null;await save(s)},'फिर खोलें');
 if(a==='compute')modal('ब्याज की गणना',termFields(calcResult||{})+inp('end','इस तारीख तक','date',calcResult?.end||today()),async f=>{check(f.end>=f.start,'अंतिम तारीख आरंभ से पहले है।');let h={...termValues(f),end:f.end};let s=structuredClone(data);s.history.push(h);await save(s);calcResult=h;render()},'गणना करें');
 if(a==='print')window.print();if(a==='download'){let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let link=document.createElement('a');link.href=u;link.download='byaj-bahi-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 if(a==='restore')$('restoreFile').click();
 }catch(x){$('status').textContent=x.message}});
$('restoreFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let s=JSON.parse(await f.text());validate(s);modal('बैकअप बहाल करें','<p class="full">मौजूदा डेटा की जगह इस फ़ाइल के '+s.people.length+' ग्राहक और '+s.loans.length+' खाते रखे जाएँगे।</p>',async()=>{await save(s);selected='';calcResult=null},'बदलकर बहाल करें')}catch(x){$('status').textContent='बैकअप पढ़ने में समस्या। '+x.message}};
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('list').innerHTML=list()}});
document.addEventListener('change',e=>{if(e.target.id==='filter'||e.target.id==='closedFilter'){if(e.target.id==='filter')filter=e.target.value;else closedFilter=e.target.value;$('list').innerHTML=list()}if(e.target.id==='asof'&&e.target.reportValidity()&&e.target.value){asof=e.target.value;render()}});
(async()=>{try{let r=indexedDB.open('byaj-bahi-ledger-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('ledger');db=await request(r);await load();render()}catch(x){$('status').textContent='बही खोलने में समस्या। ब्राउज़र की स्टोरेज अनुमति जाँचें। '+x.message}})();
</script></html>

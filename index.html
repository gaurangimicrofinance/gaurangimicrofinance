async function findLoans(term){
  if(/^D-/i.test(term)){
    const key=term.toUpperCase();
    if(cloud){
      const f=cloud.fs,c=f.collection(cloud.db,'rozkhata',cloud.uid,'records');
      return (await f.getDocsFromServer(f.query(c,f.orderBy(f.documentId()),f.startAt(key),f.endAt(key+'\uffff'),f.limit(21)))).docs.map(s=>s.data().value)
    }
    const q=scoped(key);
    return (await req(db.transaction('records').objectStore('records').getAll(IDBKeyRange.bound(q,q+'\uffff'),21))).map(x=>x.value)
  }
  return list('L/',norm(term),21)
}
function searchLoans(v){
  clearTimeout(searchTimer);
  const term=norm(v),token=++searchLoans.seq,box=$('#matches');
  box.textContent='';
  if(!term)return;
  searchTimer=setTimeout(async()=>{
    try{
      const matches=await findLoans(term);
      if(token!==searchLoans.seq||!box.isConnected)return;
      box.innerHTML=matches.slice(0,20).map(l=>'<button class="result" data-act="open:'+l.id+'"><b>'+esc(l.name)+'</b> · '+l.id+'<br><small>'+esc(l.p.name)+' · '+esc(l.mobile||'')+' · '+(l.close?'बंद':'चालू')+'</small></button>').join('')+(matches.length>20?'<small>पहले 20 परिणाम · नाम या आईडी आगे लिखें।</small>':'')||'<p>कोई डायरी नहीं मिली।</p>'

async function connect(v){

  await a.authStateReady();
  const u=v.resume?a.currentUser:(await auth.signInWithEmailAndPassword(a,v.email,v.password)).user;
  valid(u,'क्लाउड सत्र समाप्त हुआ। फिर साइन इन करें।');
  const store=fs.getFirestore(fb);
  try{
    await fs.getDocFromServer(fs.doc(store,'rozkhata',u.uid,'records','SUMMARY'))
  }catch(e){
    await auth.signOut(a);
    throw e
  }
  cloud={db:store,uid:u.uid,email:u.email,fs,a,auth};
  localStorage.setItem('rk-config',JSON.stringify(cfg));
  sessionStorage.setItem('rk-cloud','1');
  selected=null
}
async function demo(){
  space='demo';
  selected=null;
  if(await read('SUMMARY'))return;
  const p=makeProduct({name:'डेली 100 · अग्रिम ब्याज',principal:10000,days:100,months:3,monthMode:'manual',type:'before',method:'amount',interest:1500,priority:'old'});
  await saveProduct(p);
  const l={id:uid('D'),p,name:'Rahul Sharma',mobile:'',start:day(today(),-11),receipts:[],credit:0};
  await saveLoan(null,l,{date:l.start,label:'लोन जारी',amount:p.net});
  const old=structuredClone(l);
  for(let i=1;i<=11;i++){
    const pay=i===11?50000:10000;
    l.receipts.push({id:'R-DEMO-'+i,date:day(l.start,i),pay,tender:pay,credit:0,change:0})
  }
  await saveLoan(old,l,{date:today(),label:'वसूली',amount:50000})
}
function printCard(l){
  const g=ledger(l);
  $('#print').innerHTML='<h1>दैनिक लोन कार्ड</h1><h2>'+esc(l.name)+'</h2><p>'+l.id+' · '+esc(l.p.name)+' · जारी '+dt(l.start)+' · रोज़ '+money(l.p.emi)+'</p><p>हाथ में '+money(l.p.net)+' · कुल वसूली '+money(l.p.total)+' · शेष '+money(g.balance)+'</p>'+(l.close?closingInfo(l.close):'')+schedule(l,g)+'<h3>भुगतान रजिस्टर</h3>'+receipts(l);
  window.print()
}
async function backup(){
  const q=space+'/',records=await req(db.transaction('records').objectStore('records').getAll(IDBKeyRange.bound(q,q+'\uffff'))),url=URL.createObjectURL(new Blob([JSON.stringify({format:'rozkhata-v1',records})],{type:'application/json'}));
  const a=document.createElement('a');
  a.href=url;
  a.download='rozkhata-'+space+'-'+today()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000)
}
let busy=false;
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el||busy)return;
  const [op,arg]=el.dataset.act.split(':');
  busy=true;
  try{
    if(op==='go'){
      await go(arg)
    }
    if(op==='open'){
      selected=arg;
      loanTab='pay';
      await go('recover')
    }
    if(op==='tab'){
      loanTab=arg;
      await go('recover')
    }
    if(op==='print')printCard(currentLoan);
    if(op==='demo'){
      await demo();
      await go('home')
    }
    if(op==='live'){
      space='live';
      selected=null;
      await go('home')
    }
    if(op==='logout'){
      await cloud.auth.signOut(cloud.a);
      cloud=null;
      sessionStorage.removeItem('rk-cloud');
      space='live';
      selected=null;
      await go('settings')
    }
    if(op==='backup')await backup()
  }catch(e){
    note(e.message)
  }finally{
    busy=false
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='search')searchLoans(e.target.value);
  if(e.target.closest('#product'))productPreview();
  if(e.target.closest('#issue'))issuePreview();
  if(e.target.closest('#pay,#close'))paymentPreview()
});
document.addEventListener('change',e=>{
  if(e.target.id==='reportDate'&&e.target.value&&e.target.value<=today()){
    reportDate=e.target.value;
    go('reports')
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(busy)return;
  busy=true;
  const f=e.target,v=fd(f),btn=f.querySelector('button[type=submit],button.btn');
  btn.disabled=true;
  try{
    if(f.id==='product'){
      const p=makeProduct(v);
      valid(p.name,'प्रोडक्ट का नाम भरें।');
      await saveProduct(p);
      await go('products');
      note('प्रोडक्ट सेव हो गया।')
    }
    if(f.id==='issue'){
      const p=await read(v.product);
      valid(p&&v.name.trim()&&v.start&&v.start<=today(),'ग्राहक और तारीख जाँचें।');
      const l={id:uid('D'),name:v.name.trim(),mobile:v.mobile.trim(),start:v.start,p,credit:0,receipts:[]};
      await saveLoan(null,l,{label:'लोन जारी',date:l.start,amount:p.net});
      selected=l.id;
      loanTab='pay';
      await go('recover');
      note('डायरी शुरू हो गई।')
    }
    if(f.id==='pay'||f.id==='close'){
      const old=currentLoan,l=structuredClone(old),g=ledger(l);
      valid(!l.close,'डायरी पहले ही बंद है।');
      checkDate(l,v.date);
      if(f.id==='pay'){
        const tender=cents(v.amount),pay=Math.min(g.balance,tender),over=tender-pay;
        valid(tender>0&&g.balance>0,'लोन में शेष वसूली जाँचें।');
        const r={id:uid('R'),date:v.date,tender,pay,credit:v.extra==='credit'?over:0,change:v.extra==='return'?over:0};
        l.receipts.push(r);
        l.credit+=r.credit;
        if(pay===g.balance){
          l.close={id:r.id,date:r.date,fee:l.p.interest,waiver:0,cash:0,refund:0,credit:0,scheduled:true};
          loanTab="card"
        }
        await saveLoan(old,l,{date:v.date,label:'रसीद · '+r.id,amount:pay});
        note('रसीद सेव हुई · '+money(pay)+' लोन में जमा।')
      }
 else{
        const c=settle(l,v.date,v.kind,g);
        if(!confirm('डायरी बंद करें? अंतिम वसूली '+money(Math.max(0,c.net))+' · ब्याज छूट '+money(c.waiver)))return;
        const over=Math.max(0,-c.net);
        l.close={id:uid('C'),date:v.date,fee:c.fee,waiver:c.waiver,cash:Math.max(0,c.net),refund:v.extra==='return'?over:0,credit:v.extra==='credit'?over:0};
        l.credit+=l.close.credit;
        await saveLoan(old,l,{date:v.date,label:'डायरी बंद',amount:l.close.cash});
        loanTab='card';
        note('अंतिम हिसाब सेव हुआ।')
      }
      await go('recover')
    }
    if(f.id==='connect'){
      await connect(v);
      await go('home');
      note('Firebase खाता खुल गया।')
    }
  }catch(err){
    note(err.message||String(err))
  }finally{
    busy=false;
    btn.disabled=false
  }
});
(async()=>{
  try{
    db=await idb();
    if(sessionStorage.getItem('rk-cloud')){
      try{
        await connect({config:localStorage.getItem('rk-config'),resume:true});
        await go('home')
      }catch(err){
        await go('settings');
        note('क्लाउड खाता खोलने के लिए फिर साइन इन करें। '+err.message)
      }
    }else await go('home')
  }catch(e){
    $('#page').textContent='डेटाबेस खोलने में समस्या · '+e.message
  }
})();

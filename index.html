<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'—',cash=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const periods={1:'Yearly',2:'Half-yearly',4:'Quarterly',6:'Every two months',12:'Monthly',24:'Twice a month',26:'Every two weeks',52:'Weekly',104:'Twice a week',360:'Daily'};
const directions={lend:'Money lent',borrow:'Money borrowed'},alloc={both:'Interest first, then principal',principal:'Principal only',interest:'Interest only'},modes={cash:'Cash',upi:'UPI',bank:'Bank',other:'Other'};
const dateOf=d=>new Date(d+'T00:00:00Z'),validDate=d=>typeof d==='string'&&/^\d{4}-\d\d-\d\d$/.test(d)&&Number.isFinite(+dateOf(d))&&dateOf(d).toISOString().slice(0,10)===d;
function yearPart(start,end){
 const a=dateOf(start),b=dateOf(end);if(b<a)throw Error('The end date is before the start date.');
 let months=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
 if(b.getUTCDate()<a.getUTCDate())months--;
 let anchor=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+months,1));
 let last=new Date(Date.UTC(anchor.getUTCFullYear(),anchor.getUTCMonth()+1,0)).getUTCDate();
 anchor.setUTCDate(Math.min(last,a.getUTCDate()));return months/12+(b-anchor)/86400000/360;
}
function growth(l,start,end){
 const y=yearPart(start,end),r=l.rate*l.unit/100,n=l.freq;
 if(l.type==='simple')return 1+y*r;
 let whole=Math.floor(y*n);return Math.pow(1+r/n,whole)*(1+Math.max(0,y-whole/n)*r);
}
function balance(l,end=today()){
 if(l.closed&&end>l.closed)end=l.closed;
 if(end<l.start)return {p:0,i:0,paid:0,rows:[]};
 let p=l.amount,anchor=l.start,carried=0,interestPaid=0,paid=0,rows=[];
 const interest=d=>carried+p*(growth(l,anchor,d)-1)-interestPaid;
 for(const t of l.payments){
 if(t.date>end)break;
 let due=Math.max(0,interest(t.date)),ip=t.kind==='principal'?0:Math.min(due,t.amount),pp=t.amount-ip;
 if((t.kind==='interest'&&pp>0.005001)||pp>p+0.005001)throw Error('The payment exceeds the selected balance. Check the payment date and amount.');
 if(t.kind==='interest'){ip=t.amount;pp=0}
 if(pp>0){carried=Math.max(0,due-ip);p=Math.max(0,p-pp);anchor=t.date;interestPaid=0}else interestPaid+=ip;
 paid+=t.amount;rows.push({...t,ip,pp,p,i:Math.max(0,due-ip)});
 }
 let i=Math.max(0,interest(end));if(!Number.isFinite(i)||!Number.isFinite(p+i))throw Error('The result exceeds the supported numeric range.');
 return {p,i,paid,rows};
}
const fresh=()=>({version:1,rev:0,people:[],loans:[],history:[]});
let db,data=fresh(),page='book',selected='',query='',filter='all',closedFilter='open',asof=today(),submitter,calcResult=null;
function check(ok,msg){if(!ok)throw Error(msg||'The backup contains invalid data.')}
function numeric(n){return typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=1e12}
function terms(l){check(numeric(l.amount)&&l.amount>0&&numeric(l.rate)&&Object.hasOwn(periods,l.unit)&&Object.hasOwn(periods,l.freq)&&['simple','compound'].includes(l.type)&&validDate(l.start))}
function validate(s){
 check(s&&s.version===1&&Array.isArray(s.people)&&Array.isArray(s.loans)&&Array.isArray(s.history));let ids=new Set;
 function id(x){check(typeof x==='string'&&x.length>0&&!ids.has(x));ids.add(x)}
 for(const p of s.people){id(p.id);check(typeof p.name==='string'&&p.name.trim().length&&typeof p.phone==='string')}
 let people=new Set(s.people.map(p=>p.id));
 for(const l of s.loans){id(l.id);terms(l);check(people.has(l.person)&&Object.hasOwn(directions,l.dir)&&Array.isArray(l.payments)&&l.start<=today()&&(!l.due||validDate(l.due)&&l.due>=l.start));let prev=l.start;
 for(const t of l.payments){id(t.id);check(validDate(t.date)&&t.date>=prev&&t.date<=today()&&numeric(t.amount)&&t.amount>0&&Object.hasOwn(alloc,t.kind)&&Object.hasOwn(modes,t.mode));prev=t.date}
 check(!l.closed||(validDate(l.closed)&&l.closed>=prev&&l.closed<=today()));balance(l)}
 for(const h of s.history){terms(h);check(validDate(h.end)&&h.end>=h.start&&Number.isFinite(growth(h,h.start,h.end)*h.amount))}
}
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function load(){data=await request(db.transaction('ledger').objectStore('ledger').get('main'))||fresh()}
async function save(next){
 const expectedRev=next.rev;validate(next);
 await new Promise((res,rej)=>{const tx=db.transaction('ledger','readwrite'),s=tx.objectStore('ledger'),r=s.get('main');let conflict=false;r.onsuccess=()=>{if((r.result?.rev||0)!==expectedRev){conflict=true;tx.abort();return}next.rev=expectedRev+1;s.put(next,'main')};tx.oncomplete=res;tx.onabort=()=>rej(Error(conflict?'Another tab has saved changes. Reload this page and try again.':'Your changes could not be saved.'))});
 data=next;render();
}
const uid=()=>crypto.randomUUID(),action=(label,a,cls='')=>'<button type="button" class="'+cls+'" data-act="'+a+'">'+label+'</button>';
const options=(o,v)=>Object.entries(o).map(([k,t])=>'<option value="'+esc(k)+'" '+(String(v)===k?'selected':'')+'>'+esc(t)+'</option>').join('');
const select=(n,l,o,v)=>'<label>'+l+'<select name="'+n+'">'+options(o,v)+'</select></label>';
const inp=(n,l,t='text',v='',attrs='required')=>'<label>'+l+'<input name="'+n+'" type="'+t+'" value="'+esc(v)+'" '+attrs+'></label>';
const moneyAttrs='required min="0.01" max="1000000000000" step=".01"';
function termFields(l={}){return inp('amount','Principal (₹)','number',l.amount||'',moneyAttrs)+inp('rate','Interest rate (%)','number',l.rate??'2','required min="0" max="10000" step="any"')+select('unit','What period does this rate cover?',periods,l.unit||12)+select('type','Interest type',{simple:'Simple',compound:'Compound'},l.type||'simple')+select('freq','Compounding frequency',periods,l.freq||12)+inp('start','Start date','date',l.start||today())}
let previewFn=null,profileId='',customerSearch='';
function applyPayment(loan,payment){
 const index=loan.payments.findIndex(t=>t.id===payment.id);
 if(index<0)loan.payments.push(payment);else loan.payments[index]=payment;
 loan.payments.sort((a,b)=>a.date.localeCompare(b.date));
}
function panel(title,lines,foot=''){
 return '<h3>'+esc(title)+'</h3><dl>'+lines.map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl>'+(foot?'<p>'+esc(foot)+'</p>':'');
}
function attachPreview(fn){previewFn=fn;$('preview').hidden=false;$('dialog').classList.add('wide');refreshPreview()}
function refreshPreview(){
 if(!previewFn)return;
 const f=Object.fromEntries(new FormData($('form')));
 try{$('preview').innerHTML=previewFn(f)}catch(error){$('preview').innerHTML='<h3>Calculation preview</h3><p>'+esc(error.message)+'</p>'}
}
$('form').addEventListener('input',refreshPreview);$('form').addEventListener('change',refreshPreview);
function nextMonth(d){
 const a=dateOf(d);let day=a.getUTCDate();a.setUTCDate(1);a.setUTCMonth(a.getUTCMonth()+1);
 const last=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+1,0)).getUTCDate();
 a.setUTCDate(Math.min(day,last));return a.toISOString().slice(0,10);
}
function termPreview(f,existing=null){
 const l={...termValues(f),payments:existing?.payments||[],closed:existing?.closed||null};
 check(l.amount>0&&f.rate!==''&&l.rate>=0&&validDate(l.start),'Enter a principal, interest rate and start date to see the calculation.');
 const end=Object.hasOwn(f,'end')?f.end:(f.due||nextMonth(l.start));
 check(validDate(end)&&end>=l.start,'Choose a calculation date on or after the start date.');
 check(!l.payments.some(t=>t.date<l.start),'The start date falls after an existing payment.');
 // Replay all existing payments to catch edits that would invalidate later entries.
 if(existing){const now=balance(l);check(!l.closed||now.p+now.i<.005001,'Reopen the account to make changes that leave an unpaid balance.')}
 const b=balance(l,end);
 return panel('Calculation preview',[['Through',fmt(end)],['Rate',l.rate+'% · '+periods[l.unit]],['Method',l.type==='simple'?'Simple interest':'Compound · '+periods[l.freq]],['Principal outstanding',cash(b.p)],['Interest outstanding',cash(b.i)],['Total outstanding',cash(b.p+b.i)]],f.end?'Calculated for the selected dates.':(f.due?'Projected to the due date.':'One-month projection.')+' Includes recorded payments only.');
}
function paymentPreview(l,old,f){
 check(validDate(f.date)&&f.date>=l.start&&f.date<=today(),'Choose a payment date within this account’s history.');
 const a=structuredClone(l),v={id:old?.id||'__preview__',amount:+f.amount,date:f.date,kind:f.kind||'both',mode:f.mode,note:''};
 if(!v.amount){a.payments=a.payments.filter(t=>t.id!==old?.id);const b=balance(a,f.date);return panel('Payment allocation',[['Principal due',cash(b.p)],['Interest due',cash(b.i)],['Available balance',cash(b.p+b.i)]],'Enter a payment amount to see the split.')}
 check(v.amount>0,'Enter a positive payment amount.');applyPayment(a,v);balance(a);
 const b=balance(a,f.date),t=b.rows.find(x=>x.id===v.id);
 return panel('Payment allocation',[['Balance before payment',cash(t.p+t.i+t.amount)],['Applied to interest',cash(t.ip)],['Applied to principal',cash(t.pp)],['Remaining principal',cash(t.p)],['Unpaid interest',cash(t.i)],['Balance after payment',cash(t.p+t.i)]],'As of '+fmt(f.date)+' · '+alloc[v.kind]);
}
function recovery(l,b){
 const recovered=b.rows.reduce((sum,t)=>sum+t.pp,0),intPaid=b.rows.reduce((sum,t)=>sum+t.ip,0);
 const percent=Math.min(100,100*recovered/l.amount);
 return '<section class="card"><div class="row"><h2>'+(l.dir==='lend'?'Principal recovery':'Principal repayment')+'</h2><b>'+percent.toFixed(1)+'%</b></div><progress max="100" value="'+percent+'" aria-label="Principal repaid"></progress><div class="row"><small>Principal repaid '+cash(recovered)+' of '+cash(l.amount)+'</small><small>Interest paid '+cash(intPaid)+'</small></div></section>';
}
function deleteLoan(){
 const l=current(),name=person(l).name;
 modal('Delete account','<div class="full"><p><strong>'+esc(name)+'</strong> · '+directions[l.dir]+' · '+cash(l.amount)+' · '+fmt(l.start)+'</p><p>This permanently removes this account and its '+l.payments.length+' payment records. Other accounts and the customer profile are kept.</p></div>'+inp('confirmation','Type DELETE to confirm','text','','required autocomplete="off"'),async f=>{
 check(f.confirmation==='DELETE','Type DELETE exactly to confirm.');let s=structuredClone(data);s.loans=s.loans.filter(x=>x.id!==l.id);await save(s);selected='';page='book';render();
 },'Delete permanently');$('dialog').classList.add('destructive');
}
function refButton(label,act,id,cls=''){return '<button class="'+cls+'" data-act="'+act+'" data-id="'+esc(id)+'">'+label+'</button>'}
function customerRows(){
 const counts=new Map();for(const l of data.loans)counts.set(l.person,1+(counts.get(l.person)||0));
 return data.people.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(customerSearch.trim().toLowerCase())).map(p=>refButton('<span><strong>'+esc(p.name)+'</strong><small>'+esc(p.phone||'No mobile number')+'</small></span><span>'+(counts.get(p.id)||0)+' accounts ›</span>','profile',p.id,'entry')).join('')||'<p class="empty">No customers found.</p>';
}
function directory(){return '<div class="row"><h1>Customers</h1>'+action('Add customer','person','primary')+'</div><section class="card"><div class="tools filters"><input id="customerSearch" aria-label="Search customers" placeholder="Search by name or mobile number" value="'+esc(customerSearch)+'"></div><div id="customerRows">'+customerRows()+'</div></section>'}
document.addEventListener('input',e=>{if(e.target.id==='customerSearch'){customerSearch=e.target.value;$('customerRows').innerHTML=customerRows()}});
function profile(){
 const p=data.people.find(p=>p.id===profileId),ls=data.loans.filter(l=>l.person===p.id);
 let receivable=0,payable=0,paid=0;
 const rows=ls.map(l=>{const b=balance(l);if(!l.closed){if(l.dir==='lend')receivable+=b.p+b.i;else payable+=b.p+b.i}paid+=b.paid;
 return refButton('<span><strong>'+directions[l.dir]+' · '+cash(l.amount)+'</strong><small>'+fmt(l.start)+' · '+l.rate+'% '+periods[l.unit]+'</small></span><span><strong>'+cash(b.p+b.i)+'</strong><small>'+(l.closed?'Settled':'Outstanding')+'</small></span>','detail',l.id,'entry')}).join('');
 return action('← Customers','people')+'<div class="row"><div><h1>'+esc(p.name)+'</h1><small>'+esc(p.phone||'No mobile number')+'</small></div><div class="tools">'+refButton('Edit customer','editperson',p.id)+action('New account','profileloan','primary')+'</div></div>'+kpis([['Receivable',receivable],['Payable',payable],['Payments recorded',paid]])+'<section class="card"><h2>Customer accounts</h2>'+ (rows||'<p class="empty">No accounts yet.</p>')+'</section>';
}

function termValues(f){return {amount:+f.amount,rate:+f.rate,unit:+f.unit,freq:+f.freq,type:f.type,start:f.start}}
function modal(title,html,cb,label='Save'){previewFn=null;$('preview').hidden=true;$('dialog').classList.remove('wide','destructive');submitter=cb;$('title').textContent=title;$('fields').innerHTML=html;$('err').textContent='';$('form').querySelector('.primary').textContent=label;syncFreq();$('dialog').showModal();if($('form').elements.rate)attachPreview(termPreview)}
function syncFreq(){let f=$('form').elements;if(f.namedItem('freq'))f.namedItem('freq').closest('label').hidden=f.type.value!=='compound'}
$('form').onchange=syncFreq;$('close').onclick=()=>$('dialog').close();
$('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter||$('form').querySelector('.primary');b.disabled=true;try{await submitter(Object.fromEntries(new FormData(e.target)));$('dialog').close()}catch(x){$('err').textContent=x.message}finally{b.disabled=false}};
const kpis=items=>'<div class="hero"><div class="kpis">'+items.map(([k,v])=>'<div><small>'+k+'</small><b>'+cash(v)+'</b></div>').join('')+'</div></div>';
function person(l){return data.people.find(p=>p.id===l.person)}
function rules(){return '<details><summary>How interest is calculated</summary><p>Time in years is calculated as full calendar months divided by 12 plus remaining days divided by 360. Simple interest equals principal × annual rate × time in years, with the rate expressed as a decimal. Compound interest accrues over full compounding periods, with simple interest on the remaining time. Interest is zero on the start date.</p><p>When a payment reduces principal, a new interest period starts on the payment date for the remaining principal. Previously accrued unpaid interest is tracked separately. An interest-only payment continues the existing period. Amounts are displayed to two decimal places.</p></details>'}
function book(){
 let active=data.loans.filter(l=>!l.closed),lend=0,borrow=0,interest=0;for(let l of active){let b=balance(l);if(l.dir==='lend'){lend+=b.p+b.i;interest+=b.i}else borrow+=b.p+b.i}
 return '<div class="row"><h1>Account ledger</h1><div class="tools">'+action('Add customer','person')+action('＋ New account','new','primary')+'</div></div>'+kpis([['Total receivable',lend],['Total payable',borrow],['Interest receivable',interest]])+'<div class="card"><div class="row"><h2>Account register</h2><small>'+active.length+' open accounts</small></div><div class="tools filters"><input id="search" aria-label="Search customers" placeholder="Search by name or mobile number" value="'+esc(query)+'"><select id="filter" aria-label="Account type">'+options({all:'All types',...directions},filter)+'</select><select id="closedFilter" aria-label="Account status">'+options({open:'Open accounts',closed:'Closed accounts',all:'All accounts'},closedFilter)+'</select></div><div id="list">'+list()+'</div></div>';
}
function list(){let ls=data.loans.filter(l=>(closedFilter==='all'||(closedFilter==='closed')===!!l.closed)&&(filter==='all'||l.dir===filter)&&(person(l).name+' '+person(l).phone).toLowerCase().includes(query.toLowerCase()));return ls.reverse().map(l=>{let b=balance(l);return '<button class="entry" data-act="detail" data-id="'+esc(l.id)+'"><span><strong>'+esc(person(l).name)+'</strong><small>'+directions[l.dir]+' · '+fmt(l.start)+' · '+esc(l.rate)+'% '+periods[l.unit]+'</small></span><span><strong class="money">'+cash(b.p+b.i)+'</strong><small>'+(l.closed?'Closed':l.due&&l.due<today()&&b.p+b.i>=.005?'Overdue':'Outstanding')+'</small></span></button>'}).join('')||'<p class="empty">'+(data.loans.length?'No accounts match these filters.':'Select “New account” to open your first account.')+'</p>'}
function detail(l){
 const b=balance(l,asof),p=person(l);
 return action('← Account ledger','book')+'<div class="row"><div><h1>'+esc(p.name)+'</h1><span class="tag">'+directions[l.dir]+' · '+(l.closed?'Closed':'Open')+'</span> '+esc(p.phone)+'</div><div class="tools">'+(l.closed?action('Reopen account','reopen'):action('＋ Record payment','pay','primary')+action('Settle account','settle'))+action('Edit account','editloan')+action('Delete account','delloan','danger')+action('Print / PDF','print')+'</div></div><div class="tools"><label>Balance as of<input type="date" id="asof" min="'+l.start+'" max="'+today()+'" value="'+asof+'"></label></div>'+kpis([['Remaining principal',b.p],['Unpaid interest',b.i],['Total outstanding',b.p+b.i]])+recovery(l,b)+'<section class="card"><p class="printdate">Statement as of '+fmt(asof)+'</p><h2>Account terms</h2><p>'+cash(l.amount)+' · '+l.rate+'% '+periods[l.unit]+' · '+(l.type==='simple'?'Simple interest':'Compound '+periods[l.freq])+'</p><p>Start date '+fmt(l.start)+' · Due date '+fmt(l.due)+(l.closed?' · Settlement date '+fmt(l.closed):'')+'</p><p>'+esc(l.note)+'</p>'+rules()+'</section><section class="card"><h2>Payment history</h2><p>Total payments '+cash(b.paid)+'</p><div class="scroll"><table><thead><tr><th>Date</th><th>Amount</th><th>Interest</th><th>Principal</th><th>Method / details</th><th></th></tr></thead><tbody>'+b.rows.slice().reverse().map(t=>'<tr><td>'+fmt(t.date)+'</td><td>'+cash(t.amount)+'</td><td>'+cash(t.ip)+'</td><td>'+cash(t.pp)+'</td><td>'+modes[t.mode]+' · '+alloc[t.kind]+' '+esc(t.note)+'</td><td>'+(!l.closed?'<button data-act="editpay" data-id="'+esc(t.id)+'">Edit</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'+(!b.rows.length?'<p class="muted">There are no recorded payments up to this date.</p>':'')+'</section>';
}
function calc(){let h=calcResult||data.history.at(-1);return '<div class="row"><h1>Interest calculator</h1>'+action('New calculation','compute','primary')+'</div>'+(h?kpis([['Principal',h.amount],['Interest',h.amount*(growth(h,h.start,h.end)-1)],['Total amount',h.amount*growth(h,h.start,h.end)]]):'')+'<div class="card"><h2>Calculation history</h2>'+data.history.slice().reverse().map(x=>'<p>'+fmt(x.start)+' – '+fmt(x.end)+' · '+cash(x.amount)+' · '+x.rate+'% '+periods[x.unit]+' · '+(x.type==='simple'?'Simple':'Compound '+periods[x.freq])+' · Interest <b>'+cash(x.amount*(growth(x,x.start,x.end)-1))+'</b></p>').join('')+(!data.history.length?'<p>Select “New calculation” to enter an amount and dates.</p>':'')+rules()+'</div>'}
function render(){if(page==='detail'&&!current())page='book';let pages={book:'Accounts',people:'Customers',stats:'Summary',calc:'Calculator',backup:'Backup'};$('nav').innerHTML=Object.entries(pages).map(([k,v])=>action(v,k,(page===k||(page==='detail'&&k==='book'||page==='profile'&&k==='people'))?'active':'')).join('');$('view').innerHTML=page==='book'?book():page==='people'?directory():page==='profile'?profile():page==='stats'?stats():page==='detail'?detail(current()):page==='calc'?calc():'<h1>Backup and restore</h1><section class="card"><h2>Back up your accounts</h2><p>This ledger is stored locally using IndexedDB in this browser. To transfer your accounts to another phone or computer, download a backup and restore it on that device.</p><div class="tools">'+action('Download backup','download','primary')+action('Restore backup','restore')+'</div><p class="muted">'+data.people.length+' customers · '+data.loans.length+' accounts</p></section>'}
function current(){return data.loans.find(l=>l.id===selected)}
function stats(){let groups=Object.keys(directions).map(dir=>{let ls=data.loans.filter(l=>l.dir===dir),g={count:ls.length,open:0,p:0,i:0,paid:0,ip:0};for(let l of ls){let b=balance(l);if(!l.closed){g.open++;g.p+=b.p;g.i+=b.i}g.paid+=b.paid;g.ip+=b.rows.reduce((v,t)=>v+t.ip,0)}return g});return '<h1>Business summary</h1><div class="card scroll"><table><thead><tr><th>Description</th><th>Money lent</th><th>Money borrowed</th></tr></thead><tbody>'+[['count','Total accounts'],['open','Open accounts'],['p','Outstanding principal'],['i','Unpaid interest'],['paid','Recorded payments'],['ip','Interest portion of payments']].map(([k,t],i)=>'<tr><th>'+t+'</th>'+groups.map(g=>'<td>'+(i<2?g[k]:cash(g[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+action('Print / PDF','print')}
function addPerson(p){modal(p?'Edit customer':'Add customer',inp('name','Customer name','text',p?.name||'','required maxlength="100"')+inp('phone','Mobile number (optional)','tel',p?.phone||'','maxlength="20"'),async f=>{check(f.name.trim(),'Enter a name.');let s=structuredClone(data),v={id:p?.id||uid(),name:f.name.trim(),phone:f.phone.trim()};if(p)s.people[s.people.findIndex(x=>x.id===p.id)]=v;else s.people.push(v);await save(s)})}
function newLoan(existing=null,customerId=null){let pp=Object.fromEntries(data.people.map(p=>[p.id,p.name+(p.phone?' · '+p.phone:'')]));modal(existing?'Edit account':'New account',select('person','Customers',{'new':'New customer',...pp},existing?.person||customerId||data.people.at(-1)?.id||'new')+'<div class="full grid" id="newperson">'+inp('name','New customer name','text','','maxlength="100"')+inp('phone','Mobile number (optional)','tel','','maxlength="20"')+'</div>'+select('dir','Transaction type',directions,existing?.dir||'lend')+termFields(existing||{})+inp('due','Due date (optional)','date',existing?.due||'','')+inp('note','Note (optional)','text',existing?.note||'','maxlength="500"'),async f=>{let s=structuredClone(data),id=f.person;if(id==='new'){check(f.name.trim(),'Enter the customer’s name.');id=uid();s.people.push({id,name:f.name.trim(),phone:f.phone.trim()})}let l={...termValues(f),person:id,id:existing?.id||uid(),dir:f.dir,due:f.due,note:f.note,payments:existing?.payments||[],closed:existing?.closed||null};check(l.start<=today(),'The start date is in the future.');check(!l.due||l.due>=l.start,'Choose a due date on or after the start date.');if(existing){check(!l.closed||l.start<=l.closed,'The start date is after settlement.');check(!l.payments.some(t=>t.date<l.start),'The start date must be on or before the first payment.');if(l.closed){const b=balance(l);check(b.p+b.i<.005001,'These changes leave an unpaid balance. Reopen the account before changing these terms.')}s.loans[s.loans.findIndex(x=>x.id===l.id)]=l}else s.loans.push(l);await save(s);selected=l.id;page='detail';asof=today();render()});let f=$('form').elements;f.start.max=today();const change=()=>{$('newperson').style.display=f.person.value==='new'?'grid':'none';f.namedItem('name').required=f.person.value==='new'};f.person.onchange=change;change();attachPreview(values=>termPreview(values,existing))}
function payment(t,settle=false){let l=current(),day=t?.date||today(),b=balance(l,day),amt=t?.amount??(settle?+(b.p+b.i).toFixed(2):'');modal(settle?'Record full payment and settle':t?'Edit payment':'Record payment',inp('amount','Payment amount (₹)','number',amt,moneyAttrs+(settle?' readonly':''))+inp('date','Payment date','date',day,'required min="'+l.start+'" max="'+today()+'"'+(settle?' readonly':''))+(settle?'':select('kind','How should this payment be applied?',alloc,t?.kind||'both'))+select('mode','Payment method',modes,t?.mode||'cash')+inp('note','Note (optional)','text',t?.note||'','maxlength="500"'),async f=>{let s=structuredClone(data),a=s.loans.find(x=>x.id===l.id),v={id:t?.id||uid(),date:f.date,amount:+f.amount,kind:f.kind||'both',mode:f.mode,note:f.note};applyPayment(a,v);if(settle)a.closed=f.date;await save(s);asof=today();render()});attachPreview(f=>paymentPreview(l,t,f))}
document.addEventListener('click',async e=>{let btn=e.target.closest('[data-act]');if(!btn)return;let a=btn.dataset.act;$('status').textContent='';try{
 if(['book','people','stats','backup','calc'].includes(a)){page=a;render()}
 if(a==='detail'){selected=btn.dataset.id;asof=today();page='detail';render()}
 if(a==='editloan')newLoan(current());if(a==='delloan')deleteLoan();if(a==='profile'){profileId=btn.dataset.id;page='profile';render()}if(a==='profileloan')newLoan(null,profileId);if(a==='person')addPerson();if(a==='editperson')addPerson(data.people.find(x=>x.id===btn.dataset.id));if(a==='new')newLoan();if(a==='pay')payment();if(a==='editpay')payment(current().payments.find(t=>t.id===btn.dataset.id));
 if(a==='settle'){let b=balance(current());if(b.p+b.i>=.005)payment(null,true);else modal('Close zero-balance account','<p>Interest will stop accruing on this account.</p>',async()=>{let s=structuredClone(data);s.loans.find(x=>x.id===selected).closed=today();await save(s)},'Close')}
 if(a==='reopen')modal('Reopen account','<p>The payment history will be retained.</p>',async()=>{let s=structuredClone(data);s.loans.find(x=>x.id===selected).closed=null;await save(s)},'Reopen');
 if(a==='compute')modal('Calculate interest',termFields(calcResult||{})+inp('end','End date','date',calcResult?.end||today()),async f=>{check(f.end>=f.start,'The end date is before the start date.');let h={...termValues(f),end:f.end};let s=structuredClone(data);s.history.push(h);await save(s);calcResult=h;render()},'Calculate');
 if(a==='print')window.print();if(a==='download'){let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let link=document.createElement('a');link.href=u;link.download='byaj-bahi-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 if(a==='restore')$('restoreFile').click();
 }catch(x){$('status').textContent=x.message}});
$('restoreFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let s=JSON.parse(await f.text());validate(s);modal('Restore backup','<p class="full">This backup will replace your current data with '+s.people.length+' customers and '+s.loans.length+' accounts.</p>',async()=>{s.rev=data.rev;await save(s);selected='';calcResult=null},'Replace and restore')}catch(x){$('status').textContent='Unable to read the backup. '+x.message}};
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('list').innerHTML=list()}});
document.addEventListener('change',e=>{if(e.target.id==='filter'||e.target.id==='closedFilter'){if(e.target.id==='filter')filter=e.target.value;else closedFilter=e.target.value;$('list').innerHTML=list()}if(e.target.id==='asof'&&e.target.reportValidity()&&e.target.value){asof=e.target.value;render()}});
(async()=>{try{let r=indexedDB.open('byaj-bahi-ledger-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('ledger');db=await request(r);await load();render()}catch(x){$('status').textContent='Unable to open the ledger. Check your browser’s storage permissions. '+x.message}})();
</script></html>

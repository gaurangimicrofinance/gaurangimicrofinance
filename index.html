function makeProduct(v){

    const target=cents(v.emi),P=cents(v.principal);

function choices(total,n){

function allocate(l,rows,date,amount){
  let due=[],future=[],current=[];

function ledger(l){

async function atomic(keys,change){

  if(cloud){
    return cloud.fs.runTransaction(cloud.db,async tx=>{
      const lock=await tx.get(cref('!RESET'));valid(!lock.exists(),'Workspace reset in progress. Resume it in Settings.');

        const s=await tx.get(cref(k));

      for(const [key,value,search] of change(m)){if(value===null)tx.delete(cref(key));else tx.set(cref(key),{value,search:search||key})}
    })

    tx.oncomplete=ok;

    valid((m[key]?.version||0)===(old?.version||0),'This loan has changed. Reopen it before saving.');
    l.version=(old?.version||0)+1;
    const s=m.SUMMARY||total0();
    if(!old){
      s.net+=l.p.net;
      s.loans++
    }
    s.recovered+=(l.close?l.p.net:Math.min(b.collected,l.p.net))-(old?Math.min(a.collected,old.p.net):0);
    if(l.close&&!old?.close)s.closed++;
    s.credit+=(l.credit||0)-(old?.credit||0);
    s.recent=[{id:l.id,name:l.name,...event},...s.recent].slice(0,8);
    const months={};
    for(const x of deltas){
      const k=bucket(x.d),mm=months[k]||m[k]||{},v=mm[x.d]||{rev:0,cash:0};
      mm[x.d]={rev:v.rev+x.rev,cash:v.cash+x.cash,charges:(v.charges||0)+x.charges};
      months[k]=mm
    }

  })

function offer(v,fromEmi){
  const principal=cents(v.principal), n=Number(v.days);
  valid(principal>0 && principal<=1e10,'Enter a valid loan amount.');
  valid(Number.isInteger(n)&&n>=1&&n<=730,'Choose 1 to 730 collection days.');
  let interest=cents(v.interest);
  const emi=cents(v.emi);
  if(fromEmi){
    valid(emi>=100 && emi%100===0,'Enter a whole-rupee instalment.');
    if(v.type==='after') interest=emi*n-principal;
  }
  valid(Number.isSafeInteger(interest)&&interest>=0,'Total repayments must cover the amount disbursed.');
  valid(v.type!=='before'||interest<principal,'Upfront interest must be less than the loan amount.');
  const net=v.type==='before'?principal-interest:principal;
  const total=net+interest;
  const months=suggestedMonths(n);
  return withTerms({name:String(v.name||'').trim(),principal,n,months,type:v.type,interest,total,net,emi:total/n,
    priority:v.priority||'old',rate:interest*100/(principal*months)},v.termOverride?Number(v.termOverride):null);
}
function productPreview(trigger){
  const f=$('#product');if(!f)return;
  const v=fd(f);
  $('#entryHint').textContent=v.type==='before'?'Enter the deduction and days, or set a daily amount to find an equal repayment term.':'Edit interest to calculate the instalment. Edit the instalment to calculate interest over the selected days.';
  if(['interest','type'].includes(trigger)) f.dataset.fromEmi='';
  if(trigger==='emi')f.dataset.fromEmi='yes';
  const useEmi=f.dataset.fromEmi==='yes';
  let msg='';
  try{
    if(useEmi && v.type==='before' && trigger==='emi'){
      const count=cents(v.principal)/cents(v.emi);
      if(Number.isInteger(count)&&count>=1&&count<=730)f.elements.days.value=v.days=count;
    }
    if(v.type==='before' && ['days','principal'].includes(trigger))f.dataset.fromEmi='';
    const p=offer(v,useEmi);
    if(useEmi && v.type==='after')f.elements.interest.value=p.interest/100;
    const exact=p.total%(p.n*100)===0;
    const mismatch=f.dataset.fromEmi==='yes' && v.type==='before' && cents(v.emi)*p.n!==p.total;
    if(!mismatch && (!useEmi||v.type==='before'))f.elements.emi.value=exact?p.emi/100:'';
    const pct=x=>Number(x.toFixed(3))+'%';
    const line=(k,v)=>'<div class="spread entry"><span>'+k+'</span><b>'+v+'</b></div>';
    let html='<small>Customer receives</small><div class="amount">'+money(p.net)+'</div>'+
      line('Total to collect',money(p.total))+line('Agreed interest',money(p.interest))+
      line('Daily collection',money(p.emi)+' × '+p.n)+line('Full-term rate',pct(100*p.interest/p.principal))+
      line('Monthly flat rate',pct(p.rate))+'<p class="sub">Rate on the loan amount · '+termLine(p)+'</p>'+calculationRows([
      ['Suggested interest months',suggestedMonths(p.n)],['Agreed interest months',p.months+(p.manualMonths?' (manual)':' (automatic)')],
      ['Interest per month',money(p.interest)+' ÷ '+p.months+' = '+money(Math.round(p.interest/p.months))],
      ['Monthly flat rate',pct(100*p.interest/p.principal)+' ÷ '+p.months+' = '+pct(p.rate)]
    ]);
    if(!exact||mismatch){
      const opts=[];for(let k=1;k<=730;k++)if(p.total%(k*100)===0)opts.push(k);
      const near=opts.sort((a,b)=>Math.abs(a-p.n)-Math.abs(b-p.n)).slice(0,4);
      html+='<div class="note">Choose an equal whole-rupee schedule for '+money(p.total)+'.</div><div class="row">'+near.map(k=>button(money(p.total/k)+' × '+k+' days','term:'+k,'soft')).join('')+'</div>';
    }
    $('#calc').innerHTML=html;$('#saveProduct').disabled=!exact||mismatch;
    return exact&&!mismatch?p:null;
  }catch(e){msg=e.message}
  $('#calc').innerHTML='<p class="err">'+esc(msg)+'</p>';$('#saveProduct').disabled=true;return null;
}

async function deleteAccount(l){
  const g=ledger(l),dates=new Set([...Object.keys(g.rev),...Object.keys(g.cash)]);
  const months=[...new Set([...dates].map(d=>'M-'+d.slice(0,7)))];
  await atomic([l.id,'SUMMARY',...months],m=>{
    valid(m[l.id]?.version===l.version,'The account changed. Reopen it before deleting.');
    const s=m.SUMMARY||total0();s.net-=l.p.net;s.loans--;s.closed-=Number(!!l.close);
    s.credit-=l.credit||0;s.recovered-=l.close?l.p.net:Math.min(g.collected,l.p.net);
    s.recent=s.recent.filter(x=>x.id!==l.id);
    for(const d of dates){const mm=m['M-'+d.slice(0,7)],v=mm?.[d];if(!v)continue;
      v.cash-=g.cash[d]||0;v.rev-=g.rev[d]||0;if(l.close?.date===d)v.charges=(v.charges||0)-(l.close.extra||0);if(!v.cash&&!v.rev&&!v.charges)delete mm[d];}
    return [[l.id,null],['SUMMARY',s],...months.map(k=>[k,Object.keys(m[k]||{}).length?m[k]:null])];
  });
}

  const u=v.resume?a.currentUser:(await auth.signInWithEmailAndPassword(a,v.email,v.password)).user;

    if(sessionStorage.getItem('rk-cloud')){
      try{
        await connect({config:localStorage.getItem('rk-config'),resume:true});
        await go('home')
      }catch(err){
        await go('settings');
        note('Sign in again to open your cloud account. '+err.message)
      }
    }else await go('home')
  }catch(e){
    $('#page').textContent='Could not open the database · '+e.message
  }
})();
</script></body></html>

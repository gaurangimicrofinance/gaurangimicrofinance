<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MicroFinance Pro — Daily Collection</title>
<style>
:root{
 --bg:#f4f7fb;--panel:#fff;--ink:#142033;--muted:#6d7a8d;--line:#e2e8f0;
 --primary:#2563eb;--primary2:#1d4ed8;--success:#0f9d72;--danger:#dc3545;--warning:#d97706;
 --purple:#7c3aed;--nav:#101827;--nav2:#182235;--shadow:0 10px 30px rgba(15,23,42,.08);
 --radius:16px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:248px;background:linear-gradient(180deg,#0d1625,#142238);color:#dce7f6;padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:30;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 22px;font-weight:800;font-size:17px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#34d399,#2563eb);display:grid;place-items:center;color:#fff;font-size:20px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8c6d9;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#1e64db;color:white}.nav .ico{width:22px;text-align:center}
.main{margin-left:248px;width:calc(100% - 248px);min-width:0}.topbar{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.top-search{display:flex;gap:9px;align-items:center;background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:min(520px,55vw)}.top-search input{border:0;background:transparent;outline:0;width:100%}.top-actions{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#e6eefc;color:#1d4ed8;display:grid;place-items:center;font-weight:800}
.content{padding:22px;max-width:1700px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.pagehead h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:700}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(0,0,0,.06)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.success{background:var(--success);color:#fff;border-color:var(--success)}.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.btn.warn{background:#fff7ed;color:#b45309;border-color:#fed7aa}.btn.sm{padding:7px 10px;font-size:12px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,minmax(140px,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:24px;font-weight:850;margin-top:7px}.kpi .delta{font-size:11px;color:var(--muted);margin-top:4px}
.two{grid-template-columns:1.45fr .8fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}.table th{background:#f8fafc;color:#526174;font-weight:800}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdff}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.paid,.received{background:#dcfce7;color:#166534}.due{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#b91c1c}.pending{background:#e0e7ff;color:#3730a3}.waived{background:#f3e8ff;color:#6b21a8}.advance{background:#dbeafe;color:#1d4ed8}
.notice{border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:12px;font-size:12px}.alert{border:1px solid #fecaca;background:#fff1f2;color:#9f1239}.successbox{border:1px solid #bbf7d0;background:#f0fdf4}
.searchbox{display:flex;gap:8px}.searchbox input,.field input,.field select,.field textarea{width:100%;border:1px solid #d7dee8;border-radius:10px;padding:10px 11px;outline:0;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa5ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800;color:#526174}.field textarea{min-height:78px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.full{grid-column:1/-1}
.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:transparent;padding:10px 12px;color:#657287;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.metric{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12px}.metric:last-child{border-bottom:0}.metric strong{font-size:13px}
.progress{height:8px;border-radius:99px;background:#e9eef5;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);border-radius:inherit}
.customer-card{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.customer-head{display:flex;gap:12px;align-items:center}.photo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:20px;font-weight:900;color:#1e40af}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.modal-head{padding:15px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.modal-head.blue{background:linear-gradient(135deg,#1d4ed8,#2563eb)}.modal-head.red{background:linear-gradient(135deg,#b91c1c,#dc3545)}.modal-head.orange{background:linear-gradient(135deg,#c2410c,#f97316)}.modal-head.green{background:linear-gradient(135deg,#047857,#10b981)}.modal-head h3{margin:0}.close{background:rgba(255,255,255,.16);border:0;color:white;border-radius:9px;padding:7px 10px}.modal-body{padding:18px}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.choice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 8px;font-weight:800}.choice button.selected{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#111827;color:#fff;border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);display:none;max-width:360px}.toast.show{display:block}
.notification{position:fixed;right:18px;top:84px;width:min(390px,calc(100vw - 36px));background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.16);border-radius:15px;padding:14px;z-index:50;display:none}.notification.show{display:block}.notification h3{margin:0 0 8px}.mini{font-size:11px;color:var(--muted)}
.hidden{display:none!important}.muted{color:var(--muted)}.money{font-variant-numeric:tabular-nums}.right{text-align:right}.center{text-align:center}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.three,.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.sidebar{width:74px;padding:12px 8px}.brand{justify-content:center;padding-bottom:14px}.brand span{display:none}.nav button{justify-content:center;padding:12px 8px}.nav button .txt{display:none}.main{margin-left:74px;width:calc(100% - 74px)}.topbar{padding:0 12px}.top-search{width:48vw}.content{padding:13px}.pagehead{flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}.customer-card{grid-template-columns:1fr}.choice{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.topbar{height:auto;min-height:64px;gap:8px}.top-search{width:100%}.top-actions .hide-m{display:none}.content{padding:10px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:12px}.kpi .value{font-size:19px}.three,.four,.formgrid{grid-template-columns:1fr}.modal-backdrop{padding:8px}.modal{max-height:96vh;border-radius:14px}.modal-body{padding:12px}.modal-foot{padding:10px;flex-wrap:wrap}.modal-foot .btn{flex:1}.choice{grid-template-columns:1fr 1fr}.actions{width:100%}.actions .btn{flex:1}.pagehead h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">₹</div><span>MicroFinance Pro</span></div>
  <div class="nav">
    <button class="active" data-view="dashboard"><span class="ico">⌂</span><span class="txt">Dashboard</span></button>
    <button data-view="customers"><span class="ico">♙</span><span class="txt">Customers</span></button>
    <button data-view="products"><span class="ico">▣</span><span class="txt">Products</span></button>
    <button data-view="collection"><span class="ico">₹</span><span class="txt">Recovery</span></button>
    <button data-view="penalty"><span class="ico">!</span><span class="txt">Penalty</span></button>
    <button data-view="reports"><span class="ico">▤</span><span class="txt">Reports</span></button>
    <button data-view="accounting"><span class="ico">◈</span><span class="txt">Accounting</span></button>
    <button data-view="settings"><span class="ico">⚙</span><span class="txt">Settings</span></button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-search"><span>⌕</span><input id="globalSearch" placeholder="Search customer, mobile, Customer ID, Loan ID..."><button class="btn sm" id="globalSearchBtn">Search</button></div>
  <div class="top-actions"><button class="btn sm hide-m" id="todayBtn">Today</button><button class="btn sm" id="notifBtn">🔔 <span id="notifCount">0</span></button><div class="avatar">A</div></div>
</header>
<section class="content" id="appView"></section>
</main>
</div>
<div class="notification" id="notificationPanel"></div>
<div class="toast" id="toast"></div>

<!-- generic modal -->
<div class="modal-backdrop" id="modal">
 <div class="modal" id="modalBox"></div>
</div>

<script>
"use strict";
const INR = n => "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num = v => Math.max(0,Number(v)||0);
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const isoToday = () => new Date().toISOString().slice(0,10);
const addDays = (date,n)=>{const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diffDays = (a,b)=>Math.max(0,Math.floor((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000));
const money = v => Number(v||0);
const defaultState = {
  products:[{id:"PRD001",name:"Daily 10K — 100 Days",type:"Daily Collection",loanAmount:10000,interestRate:5,interestAmount:1500,interestMethod:"upfront",frequency:"Daily",termDays:100,processing:0,documentation:0,penaltyPerDay:100,foreclosure:0,active:true}],
  customers:[{
    id:"C0001245",name:"Rahul Sharma",primary:"9876543210",secondary:"9123456780",address:"Main Bazar, Indore",
    guarantor:{name:"Suresh Sharma",primary:"9988776655",secondary:"9000012345",address:"Vijay Nagar, Indore"},
    loans:[{id:"L0005687",productId:"PRD001",disbursement:(()=>{const d=new Date();d.setDate(d.getDate()-45);return d.toISOString().slice(0,10)})(),principal:10000,netDisbursed:8500,interestMethod:"upfront",interestTotal:1500,termDays:100,frequency:"Daily",status:"Active",payments:[],penalties:[],extraCharges:0}]
  }]
};
let state = JSON.parse(localStorage.getItem("mfProState")||"null") || defaultState;
let currentCustomer = state.customers[0], currentLoan = currentCustomer.loans[0], currentView="dashboard";
function save(){localStorage.setItem("mfProState",JSON.stringify(state))}
function product(id){return state.products.find(p=>p.id===id)}
function activeLoans(){return state.customers.flatMap(c=>c.loans.map(l=>({...l,customer:c}))).filter(x=>x.status==="Active")}
function fullTermMonths(loan){return Math.max(1,Math.round((loan.termDays||100)/30))}
function chargeMonths(loan, days){
  const full=fullTermMonths(loan), d=Math.max(1,Math.floor(days));
  if(d<=loan.termDays) return Math.min(full,Math.ceil(d/30));
  return full + Math.ceil((d-loan.termDays)/30);
}
function totalPrincipalRecovered(loan){return (loan.payments||[]).reduce((s,p)=>s+num(p.principal),0)}
function totalInterestReceived(loan){return (loan.payments||[]).reduce((s,p)=>s+num(p.interest),0)}
function totalPenaltyReceived(loan){return (loan.penalties||[]).filter(p=>p.status==="Received").reduce((s,p)=>s+num(p.receivedAmount||p.amount),0)}
function totalPenaltyDue(loan){return (loan.penalties||[]).filter(p=>p.status==="Due").reduce((s,p)=>s+num(p.amount),0)}
function loanSchedule(loan){
  const rows=[]; let total=loan.interestMethod==="upfront"?loan.principal:loan.principal+loan.interestTotal;
  const emi=total/loan.termDays;
  for(let i=0;i<loan.termDays;i++){rows.push({no:i+1,date:addDays(loan.disbursement,i+1),emi,received:0,actual:"",status:"Due",principal:0,interest:0})}
  return rows;
}
function allocations(loan){
  const rows=loanSchedule(loan);
  for(const p of (loan.payments||[])){
    let remaining=num(p.amount);
    for(const r of rows){
      if(remaining<=0)break;
      const need=r.emi-r.received;
      if(need<=0)continue;
      const take=Math.min(need,remaining); r.received+=take; r.actual=p.date; remaining-=take;
      if(r.received>=r.emi-0.005)r.status="Paid"; else r.status="Partial";
    }
  }
  return rows;
}
function loanTotals(loan){
  const principalRecovered=totalPrincipalRecovered(loan);
  const principalOutstanding=Math.max(0,loan.principal-principalRecovered);
  const daysUsed=diffDays(loan.disbursement,isoToday());
  const months=chargeMonths(loan,daysUsed||1);
  const monthlyInterest=loan.interestTotal/fullTermMonths(loan);
  const interestApplicable=monthlyInterest*months;
  const interestReceived=totalInterestReceived(loan);
  const recognizedInterest=interestReceived;
  const targetRecovery=loan.interestMethod==="upfront"?loan.principal:loan.principal+interestApplicable;
  return {principalRecovered,principalOutstanding,daysUsed,months,monthlyInterest,interestApplicable,interestReceived,recognizedInterest,targetRecovery};
}
function revenueTotals(){
  let interest=0,penalty=0,principal=0;
  for(const c of state.customers)for(const l of c.loans){principal+=totalPrincipalRecovered(l);interest+=totalInterestReceived(l);penalty+=totalPenaltyReceived(l)}
  return {interest,penalty,principal};
}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function render(){
  const root=document.getElementById("appView");
  const fn={dashboard:renderDashboard,customers:renderCustomers,products:renderProducts,collection:renderCollection,penalty:renderPenalty,reports:renderReports,accounting:renderAccounting,settings:renderSettings}[currentView]||renderDashboard;
  root.innerHTML=fn();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
  bindView();
}
function header(title,sub,actions=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function renderDashboard(){
 const r=revenueTotals(), loans=activeLoans(), due=loans.filter(x=>loanTotals(x).daysUsed>0);
 const today=isoToday(), dueToday=loans.filter(x=>loanSchedule(x).find(z=>z.date===today && z.status!=="Paid"));
 return header("Executive Dashboard","Daily Collection • Real-time local working data",`<button class="btn primary" data-action="newLoan">＋ New Loan</button><button class="btn success" data-action="newCollection">＋ Collection</button>`)
 +`<div class="grid kpis">
 ${kpi("Active Loans",loans.length,"Portfolio")}
 ${kpi("Principal Recovered",INR(r.principal),"Realized")}
 ${kpi("Interest Income",INR(r.interest),"Received & recognized")}
 ${kpi("Penalty Income",INR(r.penalty),"Separate recognition")}
 ${kpi("Today Due",dueToday.length,"Collections")}
 ${kpi("Penalty Due",INR(loans.reduce((s,l)=>s+totalPenaltyDue(l),0)),"Pending recovery")}
 </div>
 <div class="grid two" style="margin-top:16px">
  <div class="card"><div class="section-title"><h2>Today’s Recovery Queue</h2><span>${today}</span></div>${renderDueTable(today)}</div>
  <div class="card"><div class="section-title"><h2>Revenue Recognition</h2><span>Realized only</span></div>
   <div class="metric"><span>Principal recovered</span><strong>${INR(r.principal)}</strong></div>
   <div class="metric"><span>Interest received / recognized</span><strong>${INR(r.interest)}</strong></div>
   <div class="metric"><span>Penalty received / recognized</span><strong>${INR(r.penalty)}</strong></div>
   <div class="notice" style="margin-top:10px">Calculated interest is not revenue by itself. Revenue is recognized when the corresponding amount is actually received after principal recovery rules are satisfied.</div>
  </div>
 </div>
 <div class="card" style="margin-top:16px"><div class="section-title"><h2>Portfolio Snapshot</h2><button class="btn sm" data-view-link="reports">Open Reports</button></div>${renderLoanTable(loans)}</div>`;
}
function kpi(label,value,delta){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="delta">${delta}</div></div>`}
function renderDueTable(today){
 const rows=activeLoans().map(x=>{const row=loanSchedule(x).find(z=>z.date===today);return row?{x,row}:null}).filter(Boolean);
 if(!rows.length)return `<div class="notice successbox">No scheduled collection for today in the sample portfolio.</div>`;
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Loan ID</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(({x,row})=>`<tr><td>${esc(x.customer.name)}</td><td>${x.id}</td><td>${INR(row.emi)}</td><td><span class="badge ${row.status.toLowerCase()}">${row.status}</span></td><td><button class="btn sm primary" data-action="collect" data-loan="${x.id}" data-customer="${x.customer.id}">Collect</button></td></tr>`).join("")}</tbody></table></div>`
}
function renderLoanTable(loans){
return `<div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Loan ID</th><th>Product</th><th>Principal</th><th>Outstanding</th><th>Interest Received</th><th>Penalty</th><th>Status</th><th></th></tr></thead><tbody>${loans.map(x=>{const t=loanTotals(x);return `<tr><td>${esc(x.customer.name)}</td><td>${x.id}</td><td>${esc(product(x.productId)?.name||"")}</td><td>${INR(x.principal)}</td><td>${INR(t.principalOutstanding)}</td><td>${INR(t.interestReceived)}</td><td>${INR(totalPenaltyReceived(x))}</td><td><span class="badge ${x.status==="Active"?"paid":"pending"}">${x.status}</span></td><td><button class="btn sm" data-action="openCustomer" data-customer="${x.customer.id}" data-loan="${x.id}">Open</button></td></tr>`}).join("")}</tbody></table></div>`
}
function renderCustomers(){
 return header("Customers","Fast search — no full-list loading",`<button class="btn primary" data-action="newCustomer">＋ New Customer</button>`)
 +`<div class="card"><div class="searchbox"><input id="customerSearch" placeholder="Search name, surname, mobile, Customer ID, Loan ID..." value="${esc(document.getElementById("globalSearch")?.value||"")}"><button class="btn primary" data-action="searchCustomers">Search</button></div><div id="customerResults" style="margin-top:14px">${customerResults("")}</div></div>`;
}
function customerResults(q){
 const s=q.toLowerCase().trim(); let arr=[];
 for(const c of state.customers){const hay=[c.name,c.primary,c.secondary,c.id,c.address,...c.loans.map(l=>l.id)].join(" ").toLowerCase();if(!s||hay.includes(s))arr.push(c)}
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Customer ID</th><th>Primary</th><th>Secondary</th><th>Loans</th><th>Active</th><th></th></tr></thead><tbody>${arr.slice(0,50).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.id}</td><td>${c.primary}</td><td>${c.secondary}</td><td>${c.loans.length}</td><td>${c.loans.filter(l=>l.status==="Active").length}</td><td><button class="btn sm" data-action="openCustomer" data-customer="${c.id}">Open</button></td></tr>`).join("")||`<tr><td colspan="7" class="center muted">No matching customers.</td></tr>`}</tbody></table></div><div class="mini" style="margin-top:8px">Performance mode: results are capped; the UI never renders an unnecessary giant customer list.</div>`;
}
function renderProducts(){
 return header("Product Design","Daily Collection product engine",`<button class="btn primary" data-action="newProduct">＋ New Product</button>`)
 +`<div class="grid two"><div class="card"><div class="section-title"><h2>Active Products</h2><span>Interest rule lives here</span></div>${state.products.map(p=>`<div class="metric"><span><strong>${esc(p.name)}</strong><br><span class="mini">${p.type} • ${p.termDays} days • ${p.interestMethod==="upfront"?"Upfront":"Later"}</span></span><span><strong>${INR(p.loanAmount)}</strong><br><button class="btn sm" data-action="editProduct" data-id="${p.id}">Edit</button></span></div>`).join("")}</div><div class="card"><div class="section-title"><h2>Product Rules</h2><span>Current vertical</span></div><div class="notice">Daily Collection is active. Grace period is not used. GST is not applied. Processing/File Charge, Documentation Charge and Penalty per Day are supported. Foreclosure calculation remains configurable later.</div></div></div>`;

 <div class="card" style="margin-top:14px"><div class="section-title"><h2>Guarantor</h2></div><div class="metric"><span>${esc(c.guarantor?.name||"—")}</span><strong>${c.guarantor?.primary||"—"} / ${c.guarantor?.secondary||"—"}</strong></div><div class="mini">${esc(c.guarantor?.address||"")}</div></div>
 </div>`);
}
function saveProduct(){
 const loan=num(document.getElementById("pLoan").value),rate=num(document.getElementById("pRate").value),interest=num(document.getElementById("pInterest").value);
 const p={id:"PRD"+String(state.products.length+1).padStart(3,"0"),name:document.getElementById("pName").value.trim()||"Daily Product",type:"Daily Collection",loanAmount:loan,interestRate:rate,interestAmount:interest,interestMethod:document.getElementById("pMethod").value,frequency:"Daily",termDays:Math.max(1,Math.floor(num(document.getElementById("pTerm").value))),processing:num(document.getElementById("pProc").value),documentation:num(document.getElementById("pDoc").value),penaltyPerDay:num(document.getElementById("pPenalty").value),foreclosure:num(document.getElementById("pForeclose").value),active:true};
 state.products.push(p);save();closeModal();render();toast("Product saved successfully.");
}
function saveCustomer(){
 const c={id:"C"+String(Date.now()).slice(-7),name:document.getElementById("cName").value.trim(),primary:document.getElementById("cPrimary").value.trim(),secondary:document.getElementById("cSecondary").value.trim(),address:document.getElementById("cAddress").value.trim(),guarantor:{name:document.getElementById("gName").value.trim(),primary:document.getElementById("gPrimary").value.trim(),secondary:document.getElementById("gSecondary").value.trim(),address:document.getElementById("gAddress").value.trim()},loans:[]};
 const p=product(document.getElementById("cProduct").value), date=document.getElementById("cDate").value;
 if(!c.name||!c.primary)return toast("Customer name and primary mobile are required.");
 const interest=p.interestAmount, net=p.interestMethod==="upfront"?p.loanAmount-interest:p.loanAmount;
 const l={id:"L"+String(Date.now()).slice(-7),productId:p.id,disbursement:date,principal:p.loanAmount,netDisbursed:net,interestMethod:p.interestMethod,interestTotal:interest,termDays:p.termDays,frequency:"Daily",status:"Active",payments:[],penalties:[],extraCharges:0,disbursementMode:document.getElementById("cMode").value};
 c.loans.push(l);state.customers.push(c);save();closeModal();currentCustomer=c;currentLoan=l;render();toast("Customer and loan created.");
}
function savePayment(c,l){
 const amount=num(document.getElementById("payAmount").value), date=document.getElementById("payDate").value; if(!amount)return toast("Enter a payment amount.");
 const alreadyPrincipal=(l.payments||[]).reduce((s,p)=>s+num(p.principal),0);
 const recognitionPrincipalBase=l.interestMethod==="upfront"?num(l.netDisbursed):num(l.principal);
 const principal=Math.min(amount,Math.max(0,recognitionPrincipalBase-alreadyPrincipal));
 const interest=Math.max(0,amount-principal);
 l.payments.push({id:"TX"+Date.now(),date,amount,principal,interest,mode:document.getElementById("payMode").value,remark:document.getElementById("payRemark").value});
 if(allocations(l).filter(r=>r.status!=="Paid").length===0 && l.payments.length){l.status="Closed"}
 save();closeModal();render();toast(`Payment ${INR(amount)} recorded. Actual date preserved; schedule auto-allocated.`);
}
function savePenalty(c,l){
 const amount=num(document.getElementById("penAmount").value);if(!amount)return toast("Enter penalty amount.");
 const now=window.__penNow?window.__penNow():true, mode=window.__penMode?window.__penMode():"Cash";
 l.penalties=l.penalties||[];l.penalties.push({id:"P"+Date.now(),attractedDate:document.getElementById("penDate").value,amount,status:now?"Received":"Due",receivedDate:now?document.getElementById("penReceivedDate").value:"",mode:now?mode:"",receivedAmount:now?num(document.getElementById("penReceivedAmount").value):0,reason:document.getElementById("penReason").value,remark:document.getElementById("penRemark").value});
 save();closeModal();render();toast(now?"Penalty received and recognized separately.":"Penalty added to due ledger.");
}
function confirmPreclose(c,l){
 const t=loanTotals(l), applicable=(l.interestTotal/fullTermMonths(l))*t.months, charge=num(document.getElementById("pcCharge").value), waiver=Math.max(0,l.interestTotal-applicable)+num(document.getElementById("pcWaiver").value);
 const final=Math.max(0,t.principalOutstanding+applicable+charge-num(document.getElementById("pcWaiver").value));
 l.preClosure={date:isoToday(),days:t.daysUsed,interestCharged:applicable,interestWaived:waiver,amount:final}; l.status="Closed"; save();closeModal();render();toast(`Pre-closure calculated at ${INR(final)}. Loan marked closed.`);
}
function confirmSettlement(c,l){
 const t=loanTotals(l), applicable=(l.interestTotal/fullTermMonths(l))*t.months, final=Math.max(0,t.principalOutstanding+applicable+num(document.getElementById("stCharge").value)-num(document.getElementById("stWaiver").value));
 l.settlement={date:document.getElementById("stDate").value,days:t.daysUsed,interestCharged:applicable,amount:final}; l.status="Closed";save();closeModal();render();toast(`Settlement ${INR(final)} saved. Loan closed.`);
}
function receivePenalty(c,l,pid){const p=(l.penalties||[]).find(x=>x.id===pid);if(!p)return;penaltyModal(c,l,p.attractedDate)}
function newPenalty(){const x=activeLoans()[0];if(x)penaltyModal(x.customer,x,addDays(isoToday(),-1));else toast("No active loan available.")}
function exportCSV(){const rows=[["Customer","Loan ID","Date","Amount","Principal","Interest","Penalty"]];state.customers.forEach(c=>c.loans.forEach(l=>{(l.payments||[]).forEach(p=>rows.push([c.name,l.id,p.date,p.amount,p.principal,p.interest,0]));(l.penalties||[]).forEach(p=>rows.push([c.name,l.id,p.receivedDate||p.attractedDate,p.receivedAmount||p.amount,0,0,p.status==="Received"?p.amount:0]))}));const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="microfinance-ledger.csv";a.click();URL.revokeObjectURL(a.href)}
function bindView(){
 document.querySelectorAll("[data-view-link]").forEach(b=>b.onclick=()=>{currentView=b.dataset.viewLink;render()});
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
  const a=b.dataset.action,cid=b.dataset.customer,lid=b.dataset.loan,c=state.customers.find(x=>x.id===cid),l=c?.loans.find(x=>x.id===lid);
  if(a==="newProduct")newProductModal(); else if(a==="newCustomer")newCustomerModal(); else if(a==="newLoan")newCustomerModal(); else if(a==="newCollection"){const x=activeLoans()[0];x?collectModal(x.customer,x):toast("Create a customer/loan first.");}
  else if(a==="collect"&&c&&l)collectModal(c,l); else if(a==="openCustomer"&&c)openCustomer(c,l);
  else if(a==="preclose"&&c&&l)precloseModal(c,l); else if(a==="settlement"&&c&&l)settlementModal(c,l); else if(a==="penalty"&&c&&l)penaltyModal(c,l);
  else if(a==="newPenalty")newPenalty(); else if(a==="receivePenalty"&&c&&l)receivePenalty(c,l,b.dataset.penalty);
  else if(a==="saveProduct")saveProduct(); else if(a==="saveCustomer")saveCustomer(); else if(a==="savePayment"&&c&&l)savePayment(c,l); else if(a==="savePenalty"&&c&&l)savePenalty(c,l);
  else if(a==="confirmPreclose"&&c&&l)confirmPreclose(c,l); else if(a==="confirmSettlement"&&c&&l)confirmSettlement(c,l);
  else if(a==="exportCSV")exportCSV(); else if(a==="resetDemo"){if(confirm("Reset all local demo data?")){localStorage.removeItem("mfProState");location.reload()}}
  else if(a==="recoverySearch"){const q=document.getElementById("recoverySearch").value;document.getElementById("recoveryResults").innerHTML=customerResults(q)}
  else if(a==="searchCustomers"){const q=document.getElementById("customerSearch").value;document.getElementById("customerResults").innerHTML=customerResults(q)}
 });
 document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
document.getElementById("globalSearchBtn").onclick=()=>{currentView="customers";render();setTimeout(()=>{const i=document.getElementById("customerSearch");if(i){i.value=document.getElementById("globalSearch").value;document.querySelector('[data-action="searchCustomers"]').click()}},0)};
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("globalSearchBtn").click()});
document.getElementById("notifBtn").onclick=()=>document.getElementById("notificationPanel").classList.toggle("show");
document.getElementById("todayBtn").onclick=()=>toast("Today: "+isoToday());
document.getElementById("notificationPanel").innerHTML=`<h3>🔔 Today’s Reminders</h3><div class="mini">Live reminder panel for due collections and pending penalties.</div><div style="margin-top:10px" id="reminderBody"></div>`;
function updateReminders(){
 const today=isoToday(), due=[];activeLoans().forEach(x=>{const r=loanSchedule(x).find(z=>z.date===today&&z.status!=="Paid");if(r)due.push(`${x.customer.name} — ${INR(r.emi)}`)});
 const p=activeLoans().reduce((s,l)=>s+totalPenaltyDue(l),0);
 document.getElementById("notifCount").textContent=due.length+(p?1:0);
 document.getElementById("reminderBody").innerHTML=(due.length?due.slice(0,8).map(x=>`<div class="metric"><span>Due today</span><strong>${esc(x)}</strong></div>`).join(""):`<div class="successbox" style="padding:10px">No due collection found for today.</div>`)+(p?`<div class="metric"><span>Penalty pending</span><strong>${INR(p)}</strong></div>`:"");
}
render();updateReminders();
</script>
